<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fukun · 飞鸿雪泥</title>
<meta name="description" content="Fukun — J.D. candidate at Osgoode Hall Law School. A digital garden of legal tech tools, writing on administrative law, photos and music.">
<meta property="og:title" content="Fukun · 飞鸿雪泥 — welcome to my garden">
<meta property="og:description" content="A digital garden of legal tech tools, writing on administrative law, photos and music.">
<link rel="icon" href="logo.png">
<!-- Start fetching the garden straight away (smaller on touch screens) rather than when the script asks for it. -->
<link rel="preload" as="image" href="assets/garden-scene-640.webp" media="(pointer: coarse)" fetchpriority="high">
<link rel="preload" as="image" href="assets/garden-scene.webp" media="(pointer: fine)" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Long+Cang&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Long+Cang&display=swap" rel="stylesheet"></noscript>
<style>
  :root { --forest: #0F2E16; --paper: #F6F0E2; --moss: #7E9A32; --poppy: #E04A22; --marigold: #F2B13A; --hydrangea: #4C79A8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0B1F10; color: var(--paper); }
  body { font-family: 'Fraunces', Georgia, serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }

  #garden { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; }
  .veil { position: fixed; inset: 0; pointer-events: none; transition: opacity .8s;
          background: radial-gradient(ellipse 44% 28% at 50% 46%, rgba(8,24,12,.55), rgba(8,24,12,0) 70%),
                      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(6,18,9,.5) 100%); }
  .veil.low { background: radial-gradient(ellipse 46% 26% at 50% 26%, rgba(8,24,12,.55), rgba(8,24,12,0) 70%),
                          linear-gradient(0deg, rgba(8,24,12,.62) 0%, rgba(8,24,12,0) 50%); }
  .grain {
    position: fixed; inset: 0; pointer-events: none; opacity: .14; mix-blend-mode: overlay; z-index: 4;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .topbar { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; gap: 8px; align-items: center; max-width: calc(100vw - 32px); }
  /* Where you are: the place name stands in for a nav bar; tapping it opens the map. */
  .where { display: flex; align-items: baseline; gap: 8px; padding: 8px 16px; border-radius: 99px; white-space: nowrap;
           background: rgba(11,31,16,.55); backdrop-filter: blur(8px); border: 1px solid rgba(246,240,226,.18); }
  .where:hover { border-color: rgba(246,240,226,.5); }
  .where .pl { font-size: 15px; }
  html[lang="zh"] .where .pl { font-family: 'Long Cang', cursive; font-size: 20px; letter-spacing: .08em; line-height: 1; }
  .where .sec { font-family: system-ui, sans-serif; font-size: 11px; letter-spacing: .1em; opacity: .65; }
  /* Signposts: a quiet line of text in each bottom corner, over a dotted path, that walks to the neighbouring corner. */
  .sign { position: fixed; bottom: 18px; z-index: 5; display: flex; align-items: baseline; gap: 6px; padding: 6px 4px 8px; font-size: 13.5px;
          color: rgba(246,240,226,.72); text-shadow: 0 1px 8px rgba(6,18,9,.9); transition: color .25s, transform .3s cubic-bezier(.2,.8,.2,1.2); }
  .sign::after { content: ''; position: absolute; left: 4px; right: 4px; bottom: 2px; border-bottom: 2px dotted rgba(246,240,226,.35); transition: border-color .25s; }
  .sign .ar { font-family: system-ui, sans-serif; font-size: 12px; }
  html[lang="zh"] .sign .pl { font-family: 'Long Cang', cursive; font-size: 18px; letter-spacing: .06em; line-height: 1; }
  .sign.prev { left: 16px; } .sign.next { right: 16px; }
  .sign:hover, .sign:focus-visible { color: var(--paper); }
  .sign:hover::after, .sign:focus-visible::after { border-color: rgba(242,177,58,.75); }
  .sign.prev:hover { transform: translateX(-3px); } .sign.next:hover { transform: translateX(3px); }
  .lang { white-space: nowrap; font-size: 13px; padding: 9px 14px; border-radius: 99px; background: rgba(11,31,16,.55); backdrop-filter: blur(8px); border: 1px solid rgba(246,240,226,.18); }
  .lang:hover { border-color: rgba(246,240,226,.5); }
  .iconbtn { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: rgba(11,31,16,.55); backdrop-filter: blur(8px);
             border: 1px solid rgba(246,240,226,.18); flex: none; }
  .iconbtn:hover { border-color: rgba(246,240,226,.5); }
  .iconbtn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .hero .skip { margin-top: 18px; pointer-events: auto; font-size: 13px; color: rgba(246,240,226,.8); text-decoration: underline; text-underline-offset: 4px; text-shadow: 0 1px 8px rgba(8,24,12,.8); }
  .hero .skip:hover { color: var(--paper); }

  /* 书房: every piece of content on quiet paper, no motion. */
  .study { position: fixed; inset: 0; z-index: 8; overflow-y: auto; background: var(--paper); color: #1E2A1C; opacity: 0; visibility: hidden; transition: opacity .35s, visibility 0s .35s; }
  .study.on { opacity: 1; visibility: visible; transition: opacity .35s; }
  .study-inner { max-width: 760px; margin: 0 auto; padding: 72px 20px 96px; }
  .study .close { position: fixed; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; color: var(--forest); background: rgba(15,46,22,.07); }
  .study h1 { font-size: clamp(30px, 5vw, 44px); color: var(--forest); }
  html[lang="zh"] .study h1 { font-family: 'Long Cang', cursive; font-weight: 400; letter-spacing: .1em; }
  .study .sub { font-style: italic; opacity: .7; margin: 4px 0 8px; }
  .study section { margin-top: 40px; }
  .study h2 { font-size: 13px; font-family: system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #5C7A2A; border-bottom: 1px solid rgba(15,46,22,.12); padding-bottom: 8px; margin-bottom: 14px; }
  .study p { font-size: 16px; line-height: 1.75; }
  .study ul { list-style: none; }
  .study li { padding: 9px 0; border-bottom: 1px solid rgba(15,46,22,.06); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .study li button, .study li a { font-size: 16px; text-align: left; color: var(--forest); text-decoration: none; }
  .study li button:hover, .study li a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .study .meta { font-family: system-ui, sans-serif; font-size: 12px; opacity: .6; }
  .study .desc { flex-basis: 100%; font-size: 14px; opacity: .8; line-height: 1.6; }
  .st-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .st-photos button { aspect-ratio: 1; border-radius: 8px; overflow: hidden; }
  .st-photos img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
  .st-photos button:hover img { transform: scale(1.06); }
  .study .links { display: flex; gap: 18px; flex-wrap: wrap; }
  .study .links a { color: #A83A16; }

  /* 地图: the whole garden from above; the scenes are parts of it. */
  .mapview { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; padding: 16px; background: rgba(6,18,9,.72); backdrop-filter: blur(4px);
             opacity: 0; visibility: hidden; transition: opacity .35s, visibility 0s .35s; }
  .mapview.on { opacity: 1; visibility: visible; transition: opacity .35s; }
  .map-card { position: relative; text-align: center; transform: scale(.96); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  .mapview.on .map-card { transform: none; }
  .map-card h2 { font-weight: 400; font-size: clamp(24px, 3.4vw, 34px); }
  html[lang="zh"] .map-card h2 { font-family: 'Long Cang', cursive; letter-spacing: .1em; }
  html[lang="en"] .map-card h2 { font-style: italic; }
  .map-card .sub { font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: .08em; opacity: .7; margin: 4px 0 4px; }
  .map-card .moment { font-style: italic; font-size: 13px; color: var(--marigold); margin-bottom: 12px; }
  .map-card .close { position: absolute; top: -6px; right: -6px; width: 38px; height: 38px; border-radius: 50%; font-size: 18px; background: rgba(246,240,226,.14); }
  .map-frame { position: relative; width: min(78vh, calc(100vw - 32px), 640px); aspect-ratio: 1; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
  .map-frame { background: #0B1F10; }
  .map-frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .pin { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .pin span { padding: 5px 12px; border-radius: 99px; background: var(--paper); color: var(--forest); font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.3); transition: transform .25s; }
  .pin:hover span, .pin:focus-visible span { transform: scale(1.08); }
  .pin.here span { background: var(--marigold); }
  .pin small { font-family: system-ui, sans-serif; font-size: 10px; letter-spacing: .1em; color: var(--paper); text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .mfind { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-family: system-ui, sans-serif; }
  .mfind.got { box-shadow: 0 0 8px 3px currentColor; background: currentColor; }
  .mfind.unknown { color: rgba(246,240,226,.7); border: 1px dashed rgba(246,240,226,.5); }


  /* Typography switches with language: hand-brush for 中文, italic serif for English. */
  .display { font-weight: 400; line-height: 1.15; text-shadow: 0 2px 18px rgba(8,24,12,.6); }
  html[lang="zh"] .display { font-family: 'Long Cang', cursive; letter-spacing: .1em; }
  html[lang="en"] .display { font-style: italic; letter-spacing: .01em; }

  .stage { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .35s, visibility 0s .35s; }
  .stage.on { opacity: 1; visibility: visible; transition: opacity .6s; }
  /* Words drift in from the side you're walking towards. */
  .stage .rise { opacity: 0; transform: translate(calc(var(--dir, 0) * 56px), 10px); filter: blur(4px); transition: opacity .7s, transform .9s cubic-bezier(.2,.8,.2,1), filter .7s; }
  .stage.on .rise { opacity: 1; transform: none; filter: none; }
  .stage.on .rise:nth-child(2) { transition-delay: .08s; } .stage.on .rise:nth-child(3) { transition-delay: .16s; } .stage.on .rise:nth-child(4) { transition-delay: .24s; }

  .hero { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 16px; }
  .hero .kicker { font-size: 15px; letter-spacing: .06em; opacity: .85; }
  .hero .display { font-size: clamp(36px, 6.4vw, 76px); margin: 8px 0 18px; }
  .hero > div { transition: opacity .4s; }
  .me-near .hero > div { opacity: .25; }
  .hero .find { font-family: system-ui, sans-serif; font-size: 12.5px; letter-spacing: .14em; color: rgba(246,240,226,.75); text-shadow: 0 1px 8px rgba(8,24,12,.8); }
  .hero .find::after { content: ' ↓'; display: inline-block; animation: nudge 2.4s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(4px); } }

  /* The figure on the rock: a faint pulsing ring invites a closer look; the bubble rises from her. */
  #me { position: absolute; pointer-events: none; }
  #me .ring { position: absolute; inset: -22%; border-radius: 50%; pointer-events: auto; cursor: pointer; border: 1.5px solid rgba(246,240,226,.55);
             animation: halo 2.8s ease-out infinite; transition: opacity .3s; }
  #me.near .ring { opacity: 0; animation: none; }
  @keyframes halo { 0% { transform: scale(.75); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
  #me .bubble { position: absolute; bottom: calc(100% + 18px); left: 50%; width: var(--bw, 300px); padding: 16px 18px; border-radius: 18px;
               background: var(--paper); color: var(--forest); font-size: 14px; line-height: 1.65; box-shadow: 0 12px 30px rgba(6,18,9,.35);
               transform: translateX(calc(-50% + var(--shift, 0px))) scale(.6) rotate(-1deg); transform-origin: calc(50% - var(--shift, 0px)) 100%;
               opacity: 0; pointer-events: none; transition: opacity .3s, transform .45s cubic-bezier(.2,.8,.2,1.3); }
  #me .bubble::after { content: ''; position: absolute; top: 100%; left: calc(50% - var(--shift, 0px)); margin-left: -9px;
                      border: 9px solid transparent; border-top-color: var(--paper); }
  #me.near .bubble { opacity: 1; pointer-events: auto; transform: translateX(calc(-50% + var(--shift, 0px))) scale(1) rotate(-1deg); }
  #me .say { min-height: 3.2em; cursor: text; }
  #me .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  #me .chips button, #me .chips a { font-size: 12.5px; line-height: 1.3; padding: 5px 11px; border-radius: 99px; color: var(--forest); text-decoration: none;
                                    border: 1px solid rgba(15,46,22,.22); transition: background .2s, border-color .2s; }
  #me .chips button:hover, #me .chips a:hover { background: rgba(126,154,50,.16); border-color: var(--moss); }
  #me .chips .act { color: #A83A16; border-style: dashed; border-color: rgba(168,58,22,.45); }
  #me .chips .asked { opacity: .5; }
  #me .chips .bye { border-color: transparent; text-decoration: underline; text-underline-offset: 3px; opacity: .7; }
  @media (prefers-reduced-motion: reduce) { #me .ring, .hero .find::after { animation: none; } }

  .center-title { position: absolute; left: 0; right: 0; top: 15vh; text-align: center; padding: 0 16px; }
  .center-title .display { font-size: clamp(34px, 5.4vw, 66px); }
  .center-title .sub { font-style: italic; font-size: clamp(14px, 1.7vw, 18px); opacity: .85; margin-top: 8px; }

  /* Projects */
  /* Projects: carved stones drawn on the canvas; this is the engraving laid over each one. */
  #steles { position: absolute; inset: 0; }
  .stele { position: absolute; pointer-events: auto; text-decoration: none; text-align: center; color: #1E2B20; display: flex; flex-direction: column; align-items: center;
           padding: 0; opacity: 0; transition: opacity .6s .55s; }
  .stage.on .stele { opacity: 1; }
  .stele h3, .stele p, .stele .go { text-shadow: 0 1px 0 rgba(255,255,255,.4); }
  .stele h3 { font-size: 22px; font-weight: 600; margin: 8px 0 2px; letter-spacing: .02em; }
  .stele .tl { font-style: italic; font-size: 13.5px; opacity: .85; margin-bottom: 8px; }
  .stele .ds { font-size: 13.5px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .stele .go { margin-top: auto; font-size: 14px; color: #6B3A10; }
  .stele:hover .go, .stele:focus-visible .go { text-decoration: underline; text-underline-offset: 3px; }
  .stele:focus-visible { outline: 2px solid var(--marigold); outline-offset: 4px; border-radius: 50% / 45%; }
  /* The radar stone opens: its description gives way to a slow roll of real headlines. */
  .stele.demo { cursor: pointer; }
  .stele .ticker { display: none; width: 100%; flex: 1; min-height: 0; flex-direction: column; }
  .stele.open .face { display: none; }
  .stele.open .ticker { display: flex; }
  .ticker .window { flex: 1; min-height: 3.5em; overflow: hidden; font-size: 13px; cursor: default;
                    -webkit-mask-image: linear-gradient(transparent, #000 16%, #000 84%, transparent); mask-image: linear-gradient(transparent, #000 16%, #000 84%, transparent); }
  .ticker .roll { animation: roll linear infinite; }
  .ticker .window:hover .roll, .ticker .window:focus-within .roll { animation-play-state: paused; }
  @keyframes roll { to { transform: translateY(-50%); } }
  .headline { display: block; padding: 5px 0; text-decoration: none; color: inherit; text-align: center; }
  .headline .src { display: block; font-family: system-ui, sans-serif; font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; opacity: .65; }
  .headline .ht { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
  .headline:hover .ht, .headline:focus-visible .ht { text-decoration: underline; text-underline-offset: 2px; }
  .ticker .updated, .ticker .note { font-family: system-ui, sans-serif; font-size: 10.5px; opacity: .6; margin-top: 4px; }
  .stele .foot { margin-top: auto; padding-top: 6px; display: flex; gap: 14px; justify-content: center; align-items: baseline; flex-wrap: wrap; }
  .stele .foot .go { margin-top: 0; }
  .stele .toggle { font-size: 13px; color: #2E3B2E; text-decoration: underline; text-underline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .ticker .roll { animation: none; } .ticker .window { overflow-y: auto; } }
  .status { display: inline-flex; align-items: center; gap: 7px; font-family: system-ui, sans-serif; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #2E3B2E; }
  .lamp { width: 9px; height: 9px; border-radius: 50%; background: #8A948A; }
  .lamp[data-state="checking"] { background: #C9B98A; animation: lampPulse 1.2s ease-in-out infinite; }
  .lamp[data-state="live"] { background: #FFC94D; box-shadow: 0 0 6px 2px rgba(255,201,77,.75), 0 0 16px 4px rgba(255,170,40,.35); animation: lantern 2.6s ease-in-out infinite; }
  .lamp[data-state="sleep"] { background: #7C8C9C; }
  @keyframes lampPulse { 50% { opacity: .35; } }
  @keyframes lantern { 0%, 100% { opacity: 1; } 45% { opacity: .55; } 50% { opacity: .9; } 55% { opacity: .6; } }

  /* Fun: the vines, pond and flowers are drawn on the canvas; what hangs on them and the hit areas sit above. */
  #funFx { position: absolute; inset: 0; }
  .flower-hit { position: absolute; pointer-events: auto; cursor: pointer; border-radius: 50%; }
  /* 扔石子: a hint on the bank, and the memory that surfaces where the pebble lands. */
  .pondhint { position: absolute; transform: translateX(-50%); font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: .08em; color: rgba(246,240,226,.8);
              text-shadow: 0 1px 6px rgba(6,18,9,.9); pointer-events: none; animation: hintPulse 3s ease-in-out infinite; transition: opacity .6s; }
  .pondhint.gone { opacity: 0; animation: none; }
  @keyframes hintPulse { 50% { opacity: .45; } }
  .memory { position: absolute; z-index: 4; width: min(250px, 70vw); padding: 8px 8px 12px; border-radius: 6px; background: var(--paper); color: var(--forest);
            box-shadow: 0 14px 30px rgba(6,18,9,.5); pointer-events: none; opacity: 0; filter: blur(6px);
            transform: translate(-50%, -100%) translateY(46px) scale(.82); transform-origin: 50% 100%;
            transition: opacity .9s, filter .9s, transform 1.1s cubic-bezier(.2,.8,.2,1); }
  .memory.on { opacity: 1; filter: none; pointer-events: auto; transform: translate(-50%, -100%) translateY(-14px) scale(1); }
  .memory .bob { animation: bob 5s ease-in-out infinite; }
  @keyframes bob { 50% { translate: 0 -5px; } }
  .memory .k { display: block; font-family: system-ui, sans-serif; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #5C7A2A; margin: 2px 4px 6px; }
  .memory img { display: block; width: 100%; max-height: 210px; object-fit: contain; background: #EDE6D4; border-radius: 3px; }
  .memory .vid { position: relative; }
  .memory .vid::after { content: '▶'; position: absolute; inset: 0; margin: auto; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
                        background: rgba(246,240,226,.92); color: var(--forest); font-size: 13px; padding-left: 3px; }
  .memory .note { display: grid; place-items: center; height: 90px; font-size: 40px; color: #B07A1E; background: radial-gradient(circle, rgba(242,177,58,.28), rgba(242,177,58,0) 70%); }
  .memory .ttl { font-size: 13.5px; line-height: 1.4; margin: 8px 4px 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .memory button { margin: 8px 4px 0; font-size: 13px; color: #A83A16; }
  @media (prefers-reduced-motion: reduce) { .pondhint, .memory .bob { animation: none; } }
  .flower-hit:focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; }
  /* Photos hang from the vines like prints drying; videos hang among them as paper lanterns. */
  .hang { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; transform-origin: 50% 0; will-change: transform; }
  .hang::before { content: ''; position: absolute; left: 50%; top: -10px; width: 1px; height: 12px; background: rgba(58,44,30,.85); }
  .peg { position: absolute; left: 50%; top: -9px; width: 6px; height: 14px; margin-left: -3px; border-radius: 2px; z-index: 1;
         background: linear-gradient(90deg, #B8905E, #8E6A40); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .frame { display: block; width: 100%; height: 100%; transform-origin: 50% 0; transition: transform .35s cubic-bezier(.2,.8,.2,1.3), box-shadow .3s; }
  .hang:hover, .hang:focus-visible { z-index: 3; }
  .hang:hover .frame, .hang:focus-visible .frame { transform: scale(1.18); }
  .print { background: var(--paper); padding: 4px 4px 14px; border-radius: 2px; box-shadow: 0 8px 18px rgba(6,18,9,.45); }
  .print img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lantern { display: flex; flex-direction: column; align-items: center; }

      for (let i = 0; i < 18; i++) { const r = 6 * Math.sqrt(Math.random()), b = rnd(0, 6.28); add(px + Math.cos(b) * r, py + Math.sin(b) * r, petal, 3); }
    }
    for (let i = 0; i < 10; i++) { const r = rnd(0, 3.5), b = rnd(0, 6.28); add(Math.cos(b) * r, -h + Math.sin(b) * r, [96, 62, 22], 2); }
    return { dots, h: (h + 14) * S };
  }

  function layoutFun() {
    if (!W) return;
    const narrow = W < 760;
    pond = { cx: W / 2, cy: H * (narrow ? 0.84 : 0.81), rx: Math.min(W * (narrow ? 0.44 : 0.34), 400), ry: Math.min(H * 0.1, 80) };
    pondDots = [];
    for (let y = pond.cy - pond.ry * 1.2; y < pond.cy + pond.ry * 1.2; y += 3) for (let x = pond.cx - pond.rx * 1.2; x < pond.cx + pond.rx * 1.2; x += 3) {
      const nx = (x - pond.cx) / pond.rx, ny = (y - pond.cy) / pond.ry, d = Math.hypot(nx, ny);
      const wob = 1 + 0.05 * Math.sin(Math.atan2(ny, nx) * 5);
      if (d < 0.98 * wob) { const px = x + rnd(-1, 1), py = y + rnd(-1, 1); pondDots.push([px, py, d / wob, 0, Math.random(), Math.hypot(px - pond.cx, (py - pond.cy) * pond.rx / pond.ry)]); }
      else if (d < 1.1 * wob && Math.random() < 0.8) pondDots.push([x + rnd(-1, 1), y + rnd(-1, 1), d, 1, Math.random()]);
    }
    funFx.querySelectorAll('.flower-hit').forEach(n => n.remove());

    // Music: glowing flowers along the far bank.
    flowers = tracks.map((tr, i) => {
      const m = tracks.length, a = Math.PI * (1.2 + 0.6 * (m > 1 ? i / (m - 1) : 0.5));
      const x = pond.cx + Math.cos(a) * pond.rx * 1.02, y = pond.cy + Math.sin(a) * pond.ry * 1.22;
      const f = { ...growFlower(PETALS[i % PETALS.length], narrow ? 1.3 : 1.55), tr, x, y, ph: rnd(0, 6.28), hover: false, hk: 0, delay: 500 + i * 140 };
      const hit = el('button', 'flower-hit');
      hit.type = 'button'; hit.setAttribute('aria-label', `${t('music')}: ${tr.e.title || ''}`);
      Object.assign(hit.style, { left: x - 30 + 'px', top: y - f.h - 10 + 'px', width: '60px', height: f.h + 10 + 'px' });
      hit.onmouseenter = hit.onfocus = () => { f.hover = true; showFunTip('music', 'listen', tr.e.title, x, y - f.h - 14); };
      hit.onmouseleave = hit.onblur = () => { f.hover = false; funTip.classList.remove('on'); };
      hit.onclick = () => openItem(tr);
      funFx.append(hit);
      return f;
    });
    if (funActive) layoutVines(); else { funFx.querySelectorAll('.hang').forEach(n => n.remove()); vines = []; }
    pondHint.style.left = pond.cx + 'px'; pondHint.style.top = pond.cy + pond.ry * 1.15 + 6 + 'px';
  }

  // ─── 扔石子: toss a pebble into the pond and a random memory surfaces ─────
  const pondHint = document.getElementById('pondHint'), memoryEl = document.getElementById('memory'), memoryBody = document.getElementById('memoryBody');
  let pebbles = [], splashes = [], drops = [], memBag = [], memTimer = 0;
  const inPond = (x, y) => pond && Math.hypot((x - pond.cx) / pond.rx, (y - pond.cy) / pond.ry) < 0.95;

  // A shuffled bag: every memory comes up once before any repeats.
  function nextMemory() {
    if (!memBag.length) {
      memBag = [...photos, ...tracks, ...videos];
      for (let i = memBag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [memBag[i], memBag[j]] = [memBag[j], memBag[i]]; }
    }
    return memBag.pop();
  }

  function tossPebble(x, y) {
    const now = performance.now();
    pondHint.classList.add('gone');
    sinkMemory();
    // Thrown from just below the visitor's view, it arcs into the water.
    pebbles.push({ x0: Math.max(30, Math.min(W - 30, x + rnd(-120, 120))), y0: H + 20, x1: x, y1: y, t0: now });
  }

  function drawPebbles(now) {
    for (const pb of pebbles) {
      const p = Math.min(1, (now - pb.t0) / 520), x = pb.x0 + (pb.x1 - pb.x0) * p, y = pb.y0 + (pb.y1 - pb.y0) * p - Math.sin(p * Math.PI) * 120;
      for (let i = 0; i < 16; i++) { const a = i * 2.4, r = (i % 4) * 1.4; put((x + Math.cos(a) * r * 1.3) | 0, (y + Math.sin(a) * r) | 0, 2, 130 + (i % 3) * 20, 136 + (i % 3) * 20, 128 + (i % 3) * 18); }
      if (p >= 1 && !pb.landed) {
        pb.landed = true;
        splashes.push({ x: pb.x1, y: pb.y1, t0: now });
        for (let i = 0; i < 18; i++) drops.push({ x: pb.x1, y: pb.y1, vx: rnd(-1.6, 1.6), vy: rnd(-3.6, -1.6), t0: now });
        clearTimeout(memTimer);
        memTimer = setTimeout(() => surfaceMemory(pb.x1, pb.y1), 650);
      }
    }
    pebbles = pebbles.filter(pb => !pb.landed);
    for (const d of drops) {
      const t = (now - d.t0) / 16;
      put((d.x + d.vx * t) | 0, (d.y + d.vy * t + 0.09 * t * t) | 0, 2, 214, 232, 236);
    }
    drops = drops.filter(d => now - d.t0 < 700);
    splashes = splashes.filter(sp => now - sp.t0 < 2400);
  }

  function surfaceMemory(x, y) {
    const it = nextMemory();
    if (!it || !funActive) return;
    const k = el('span', 'k'); k.textContent = `${t('memoryK')}${it.e.date ? ' · ' + it.e.date : ''}`;
    let media;
    if (it.kind === 'photo') { media = el('img'); media.src = it.img; media.alt = it.e.title || ''; }
    else if (it.kind === 'video') { const img = el('img'); img.src = `https://i.ytimg.com/vi/${it.id}/mqdefault.jpg`; img.alt = ''; media = el('div', 'vid', [img]); }
    else media = el('div', 'note', ['♪']);
    const ttl = el('p', 'ttl'); ttl.textContent = it.e.title || '';
    const open = el('button'); open.type = 'button'; open.textContent = t(it.kind === 'music' ? 'listen' : it.kind === 'video' ? 'watch' : 'memoryOpen');
    open.onclick = () => openItem(it);
    memoryBody.replaceChildren(k, media, ttl, open);
    memoryEl.style.left = Math.max(135, Math.min(W - 135, x)) + 'px';
    memoryEl.style.top = y + 'px';
    memoryEl.classList.add('on');
    // Left alone, the memory slips back under the water.
    clearTimeout(memoryEl.sinkTimer);
    memoryEl.sinkTimer = setTimeout(sinkMemory, 12000);
  }
  function sinkMemory() { memoryEl.classList.remove('on'); clearTimeout(memoryEl.sinkTimer); }
  memoryEl.onmouseenter = () => clearTimeout(memoryEl.sinkTimer);
  memoryEl.onmouseleave = () => { memoryEl.sinkTimer = setTimeout(sinkMemory, 6000); };

  // Water darkens toward the middle; rings of light roll outward across it.
  function drawPond(now) {
    if (!funActive || !pond || morphStart >= 0) return;
    const grow = Math.min(1, (now - funT0) / 900), reach = 1.15 * (1 - (1 - grow) ** 3);
    const rim = [[150, 158, 150], [124, 134, 126], [176, 182, 172], [96, 120, 80]];
    for (const [x, y, d, kind, seed, dist] of pondDots) {
      if (d > reach) continue;
      if (kind) { const c = rim[(seed * 4) | 0]; put(x | 0, y | 0, 3, c[0], c[1], c[2]); continue; }
      const wave = reduce ? 0 : Math.sin(dist * 0.075 - now * 0.0025);
      let r = 34 + 46 * d, g = 66 + 58 * d, b = 80 + 54 * d;
      if (wave > 0.82) { const k = (wave - 0.82) / 0.18 * 0.5; r += (200 - r) * k; g += (226 - g) * k; b += (230 - b) * k; }
      if (seed > 0.995 && Math.sin(now * 0.004 + x) > 0.85) { r = 236; g = 244; b = 240; }
      // Each splash sends two rings outward that fade as they spread.
      if (splashes.length) for (const sp of splashes) {
        const age = now - sp.t0;
        if (age < 0 || age > 2400) continue;
        const d = Math.hypot(x - sp.x, (y - sp.y) * pond.rx / pond.ry), fade = 1 - age / 2400;
        for (const ring of [age * 0.11, age * 0.11 - 20]) {
          const k = Math.max(0, 1 - Math.abs(d - ring) / 5) * fade * 0.8;
          if (k > 0) { r += (226 - r) * k; g += (240 - g) * k; b += (240 - b) * k; }
        }
      }
      put(x | 0, y | 0, 3, r, g, b);
    }
    drawPebbles(now);
  }

  // Glows reuse a falloff mask per radius, so no square roots are taken per pixel per frame.
  const glowMasks = new Map();
  function glowMask(R) {
    if (!glowMasks.has(R)) {
      const dx = [], dy = [], f = [];
      for (let y = -R; y <= R; y++) for (let x = -R; x <= R; x++) {
        const d = Math.hypot(x, y) / R;
        if (d < 1) { dx.push(x); dy.push(y); f.push((1 - d) * (1 - d)); }
      }
      glowMasks.set(R, { dx: Int16Array.from(dx), dy: Int16Array.from(dy), f: Float32Array.from(f) });
    }
    return glowMasks.get(R);
  }
  function glow(cx, cy, R, k, tint) {
    const m = glowMask(R | 0), X0 = cx | 0, Y0 = cy | 0;
    for (let i = 0; i < m.f.length; i++) {
      const X = X0 + m.dx[i], Y = Y0 + m.dy[i];
      if (X < 0 || Y < 0 || X >= W || Y >= H) continue;
      const idx = Y * W + X, c = img32[idx], f = k * m.f[i];
      const r = (c & 255) + (tint[0] - (c & 255)) * f, g = ((c >> 8) & 255) + (tint[1] - ((c >> 8) & 255)) * f, b = ((c >> 16) & 255) + (tint[2] - ((c >> 16) & 255)) * f;
      img32[idx] = (255 << 24) | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0);
    }
  }

  function drawFlowers(now) {
    if (!funActive || morphStart >= 0) return;
    const age = now - funT0;
    for (const f of flowers) {
      const gr = Math.max(0, Math.min(1, (age - f.delay) / 900));
      if (!gr) continue;
      f.hk += ((f.hover ? 1 : 0) - f.hk) * 0.12;
      const e = reduce ? 1 : easeOutBack(gr);
      const sway = reduce ? 0 : Math.sin(now * 0.0016 + f.x * 0.02) * 3 * gustAt(f.x, now) * calmK;
      // A soft, breathing halo: brighter while the cursor is on the flower.
      glow(f.x + sway, f.y - (f.h - 20) * e, 40, (0.26 + 0.12 * Math.sin(now * 0.003 + f.ph)) * gr + 0.45 * f.hk, [255, 236, 170]);
      for (const [dx, dy, r, g, b, s] of f.dots) {
        const lift = -dy / f.h, k = 0.3 * f.hk;
        put((f.x + dx * e + sway * lift) | 0, (f.y + dy * e) | 0, s, r + (255 - r) * k, g + (245 - g) * k, b + (215 - b) * k);
      }
    }
  }

  function setFunActive(on) {
    if (on === funActive) return;
    funActive = on;
    if (on) { funT0 = performance.now(); layoutFun(); }
    else { funTip.classList.remove('on'); sinkMemory(); }
  }

  async function loadFun() {
    const get = u => fetch(u).then(r => r.ok ? r.json() : { entries: [] }).catch(() => ({ entries: [] }));
    const [ig, notion] = await Promise.all([get('instagram-posts.json'), get('notion-posts.json')]);
    for (const e of [...(ig.entries || []), ...(notion.entries || [])]) {
      const img = firstImage(e);
      if (e.section === 'photography' && img) photos.push({ kind: 'photo', e, img });
      else if (e.section === 'music') { const sp = spotifyEmbed(e); if (sp) tracks.push({ kind: 'music', e, spotify: sp }); }
      else if (e.section === 'video') { const id = youtubeId(e); if (id) videos.push({ kind: 'video', e, id }); }
    }
    photos.sort((a, b) => new Date(b.e.date) - new Date(a.e.date));
    layoutFun();
    buildFinds();
    if (studyOpen) renderStudy();
    openPostLink();
  }

  // ─── 苗圃: writing grows as plants, by how far along each piece is ───────
  // Short notes are seedlings, longer reflections are budding, deep analyses are evergreens.
  const BED_COLORS = [[96, 140, 205], [242, 177, 58], [228, 86, 46]];
  const bedOf = s => s === 'law' ? 0 : s === 'tech' ? 1 : (s === 'essays' || s === 'investment') ? 2 : -1;
  const richText = b => (b.rich_text || []).map(r => r.text || '').join('');

  // ─── 藤蔓: pieces that cite the same case or statute are joined by a vine ──
  // A case counts only where "X v Y" is followed by a real citation ([1999] 2 SCR 817 or 2019 SCC 65).
  const CASE_GENERIC = new Set(['Canada', 'Ontario', 'Quebec', 'Québec', 'R', 'The', 'Queen', 'Attorney', 'General', 'AG', 'Minister', 'Her', 'Majesty', 'His',
    'Province', 'City', 'Board', 'Commission', 'Ltd', 'Inc', 'Corp', 'Corporation', 'Association', 'Society', 'Union', 'Local', 'Council', 'Justice', 'Department',
    'Government', 'Region', 'Regional', 'Municipality', 'Authority', 'Civil', 'District', 'Liberty', 'Liberties',
    'Canadian', 'British', 'Columbia', 'Alberta', 'Manitoba', 'Saskatchewan', 'Nova', 'Scotia', 'Federal', 'National', 'Royal']);
  // Words that start sentences or headings and must never be mistaken for a party's name.
  const CASE_STOP = new Set(['Sources', 'Law', 'But', 'Analysis', 'Air', 'New', 'Using', 'See', 'In', 'Per', 'Also', 'Under', 'Following', 'From', 'As', 'Since',
    'Like', 'Unlike', 'Both', 'Even', 'Yet', 'However', 'Compare', 'Note', 'After', 'Before', 'While', 'When', 'Where', 'Why', 'How', 'What', 'Citing', 'Applying',
    'Case', 'Cases', 'Key', 'Facts', 'Issue', 'Held', 'Ratio', 'Decision', 'Remote', 'York']);
  const CITATION = String.raw`(?:\[\d{4}\]\s+\d+\s+S\.?C\.?R\.?\s+\d+|\d{4}\s+(?:SCC|ONCA|FCA|FC|ONSC|ONSCDC|BCCA|ABCA|QCCA|HRTO|CanLII)\s+\d+)`;
  const PARTY = String.raw`(?:[A-Z][\w'’.\-]*|\([^)\n]{0,80}\)|of|and|the|de|du|des|la|le)`;
  const CASE_RE = new RegExp(`(${PARTY}(?:[ \\t,]+${PARTY})*)[ \\t]+v\\.?[ \\t]+(${PARTY}(?:[ \\t]+${PARTY})*),?\\s+(${CITATION})`, 'g');
  const ACT_RE = /\b([A-Z][\w'’]+(?:\s+(?:[A-Z][\w'’]+|and|of|the|for|on))*\s+(?:Act|Code))\b/g;
  const capWords = s => s.replace(/\([^)]*\)/g, '').split(/\s+/).map(w => w.replace(/^[.,'’]+|[.,'’]+$/g, '')).filter(w => /^[A-Z]/.test(w));
  const keepWord = w => !CASE_GENERIC.has(w) && !CASE_STOP.has(w);
  const actName = raw => raw.replace(/^(?:The|An|A|This|Under|Ontario['’]s)\s+/, '');
  const postText = e => Array.isArray(e.blocks) && e.blocks.length ? e.blocks.map(richText).join('\n') : String(e.body || '');

  // Short name of a case: the first distinctive word of the first party, else the second party.
  function caseName(a, b) {
    const A = capWords(a).slice(-5).filter(keepWord);
    if (A.length) return { key: A[0], label: A.slice(0, 2).join(' ') };
    const B = capWords(b).filter(keepWord);
    return B.length ? { key: B.join(' '), label: B.join(' ') } : null;
  }

  let links = [], refNames = new Map();
  const refLabel = ref => refNames.get(ref) || ref;
  function linkWriting() {
    const texts = posts.map(p => postText(p.e));
    const cases = new Map(), acts = new Map();
    for (const tx of texts) for (const m of tx.matchAll(CASE_RE)) {
      const c = caseName(m[1], m[2]);
      if (c && c.key.length >= 3 && !cases.has(c.key)) cases.set(c.key, c.label);
    }
    for (const tx of texts) for (const m of tx.matchAll(ACT_RE)) {
      const name = actName(m[1]);
      if (name.split(/\s+/).length >= 2) acts.set(name.toLowerCase(), name);
    }
    // An abbreviated act ("AGCO Act") folds into its full name when the initials match.
    const actKey = new Map([...acts.keys()].map(k => [k, k]));
    for (const [low, name] of acts) {
      const initials = name.replace(/\s+(?:Act|Code)$/, '').split(/\s+/).filter(w => /^[A-Z]/.test(w)).map(w => w[0]).join('');
      const abbrev = `${initials} ${name.split(/\s+/).pop()}`.toLowerCase();
      if (initials.length >= 3 && acts.has(abbrev)) actKey.set(abbrev, low);
    }
    refNames = new Map([...[...cases].map(([k, label]) => ['case:' + k, label]), ...[...acts].map(([k, name]) => ['act:' + k, name])]);
    posts.forEach((p, i) => {
      const refs = new Set();
      // A piece cites a case only where it writes the case out with its citation; a bare short name can belong to another case.
      for (const m of texts[i].matchAll(CASE_RE)) { const c = caseName(m[1], m[2]); if (c && cases.has(c.key)) refs.add('case:' + c.key); }
      for (const m of texts[i].matchAll(ACT_RE)) { const k = actKey.get(actName(m[1]).toLowerCase()); if (k) refs.add('act:' + k); }
      p.refs = refs; p.related = new Map(); p.shared = [];
    });
    // Each shared reference strings its pieces together in date order, so a much-cited case makes one vine, not a tangle.
    const byRef = new Map();
    posts.forEach(p => p.refs.forEach(r => { if (!byRef.has(r)) byRef.set(r, []); byRef.get(r).push(p); }));
    const edges = new Map();
    for (const [ref, list] of byRef) {
      if (list.length < 2) continue;
      list.sort((a, b) => new Date(a.e.date) - new Date(b.e.date));
      list.forEach(p => {
        p.shared.push(ref);
        list.forEach(q => { if (q !== p) { if (!p.related.has(q)) p.related.set(q, []); p.related.get(q).push(ref); } });
      });
      for (let i = 1; i < list.length; i++) {
        const [a, b] = [list[i - 1], list[i]], k = posts.indexOf(a) + '|' + posts.indexOf(b);
        if (!edges.has(k)) edges.set(k, { a, b, refs: [] });
        edges.get(k).refs.push(ref);
      }
    }
    links = [...edges.values()];
  }

  // Vines arch from plant to plant: faint and sparse at rest, bright and leafy around the plant under the cursor.
  function drawTendrils(now) {
    if (!nurseryOn || morphStart >= 0 || !links.length) return;
    const age = now - nurseryT0 - 1400;
    if (age < 0) return;
    const grow = Math.min(1, age / 1400), hovered = plants.find(p => p.hover);
    for (const l of links) {
      const A = l.a.plant, B = l.b.plant;
      if (!A || !B) continue;
      const lit = !!hovered && (hovered === A || hovered === B);
      const ax = A.x, ay = A.y - A.h * A.scale * 0.7, bx = B.x, by = B.y - B.h * B.scale * 0.7;
      const dist = Math.hypot(bx - ax, by - ay);
      const sway = reduce ? 0 : Math.sin(now * 0.0012 + ax * 0.01) * 6 * gustAt((ax + bx) / 2, now) * calmK;
      const cx = (ax + bx) / 2 + sway, cy = Math.min(ay, by) - 16 - dist * 0.16;
      const stepPx = lit ? 2.5 : 8, n = Math.floor(dist / stepPx);
      for (let i = 0; i <= n * grow; i++) {
        const tt = i / n, u = 1 - tt;
        const x = u * u * ax + 2 * u * tt * cx + tt * tt * bx, y = u * u * ay + 2 * u * tt * cy + tt * tt * by;
        if (lit) {
          put(x | 0, y | 0, 3, 150, 200, 92);
          if (i % 8 === 4) { put((x + 3) | 0, (y - 4) | 0, 2, 120, 176, 70); put((x + 5) | 0, (y - 6) | 0, 2, 120, 176, 70); }
        } else put(x | 0, y | 0, 2, 104, 128, 70);
      }
    }
  }
  const textLength = e => Array.isArray(e.blocks) && e.blocks.length ? e.blocks.reduce((n, b) => n + richText(b).length, 0) : String(e.body || '').length;
  const maturity = n => n < 2500 ? 0 : n < 6500 ? 1 : 2;
  const easeOutBack = p => 1 + 2.2 * Math.pow(p - 1, 3) + 1.2 * Math.pow(p - 1, 2);
  let posts = [], plants = [], soil = [], nurseryOn = false, nurseryT0 = 0, readerOpen = false, calmK = 1;

  // A plant as stippled dots in local space: base at (0, 0), growing up (negative y).
  function growPlant(stage, accent) {
    const dots = [], add = (x, y, c, s) => dots.push([x, y, c[0], c[1], c[2], s]);
    const stem = [46, 90, 38], leaves = [[90, 125, 40], [127, 168, 58], [155, 195, 74], [185, 216, 106]];
    const leaf = (cx, cy, len, ang, n) => {
      for (let i = 0; i < n; i++) {
        const t = Math.random(), w = Math.sin(t * Math.PI) * len * 0.3, o = rnd(-w, w), along = t * len;
        add(cx + Math.cos(ang) * along - Math.sin(ang) * o, cy + Math.sin(ang) * along + Math.cos(ang) * o, leaves[(Math.random() * 4) | 0], Math.random() < 0.6 ? 2 : 3);
      }
    };
    if (stage === 0) {
      const h = 22;
      for (let y = 0; y > -h; y -= 1.5) add(rnd(-0.5, 0.5), y, stem, 2);
      leaf(0, -h, 13, -Math.PI * 0.85, 28); leaf(0, -h, 13, -Math.PI * 0.15, 28);
      return { dots, h: h + 8, w: 30 };
    }
    if (stage === 1) {
      const h = 46;
      for (let y = 0; y > -h; y -= 1.5) add(Math.sin(y * 0.08) * 1.5, y, stem, 2);
      for (let k = 0; k < 3; k++) { const y = -h * (0.28 + k * 0.22); leaf(0, y, 17 - k * 2, -Math.PI * 0.9, 32); leaf(0, y - 4, 17 - k * 2, -Math.PI * 0.1, 32); }
      for (let i = 0; i < 26; i++) { const a = rnd(0, 6.28), r = rnd(0, 5.5); add(Math.cos(a) * r, -h - 4 + Math.sin(a) * r, accent, 3); }
      return { dots, h: h + 10, w: 42 };
    }
    const th = 28, R = 30, cy = -th - R * 0.75, crown = [[30, 78, 40], [52, 104, 48], [88, 140, 56], [130, 170, 70], [172, 202, 98]];
    for (let y = 0; y > -th - 6; y -= 1.5) for (let x = -2; x <= 2; x += 2) add(x + rnd(-0.4, 0.4), y, [107, 74, 43], 2);
    for (let i = 0; i < 460; i++) {
      const a = rnd(0, 6.28), r = R * Math.sqrt(Math.random()), x = Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.85;
      const l = Math.max(0, Math.min(0.999, (-x * 0.5 - (y - cy) * 0.8) / R * 0.5 + 0.5 + rnd(-0.2, 0.2)));
      add(x, y, crown[(l * 5) | 0], 3);
    }
    for (let i = 0; i < 6; i++) { const a = rnd(0, 6.28), r = rnd(0, R * 0.8); for (let j = 0; j < 6; j++) add(Math.cos(a) * r + rnd(-2.5, 2.5), cy + Math.sin(a) * r * 0.85 + rnd(-2.5, 2.5), accent, 3); }
    return { dots, h: th + R * 1.75, w: R * 2 + 6 };
  }

  const bedsEl = document.getElementById('beds'), ptip = document.getElementById('ptip');
  function layoutNursery() {
    if (!W) return;
    plants = []; soil = [];
    bedsEl.replaceChildren();
    const titleBox = document.querySelector('[data-id="seedbed"] .center-title').getBoundingClientRect();
    const top = Math.max(titleBox.bottom + 56, H * 0.36), bottom = H - 48;
    const wide = W >= 760, margin = Math.max(20, W * 0.06), gap = 28;
    const groups = [[], [], []];
    posts.forEach(p => groups[p.bed].push(p));
    // Beds share the space by how much is growing in them; an empty bed keeps a small plot.
    const weights = groups.map(l => l.length ? Math.max(1, l.length / 4) : 0.45), total = weights.reduce((a, b) => a + b, 0);
    const span = (wide ? W - margin * 2 : bottom - top) - gap * 2;
    let cursor = wide ? margin : top;
    groups.forEach((list, bi) => {
      const size = span * weights[bi] / total;
      const bw = wide ? size : W - margin * 2, bh = wide ? bottom - top : size;
      const bx = wide ? cursor : margin, by = wide ? top : cursor;
      cursor += size + gap;
      const n = Math.max(1, list.length);
      const cols = Math.max(1, Math.min(n, Math.ceil(Math.sqrt(n * bw / bh)))), rows = Math.ceil(n / cols);
      const cw = bw / cols, ch = (bh - 30) / rows;
      // A plot of dark earth with a ragged edge, then lighter furrows under each row.
      const earth = [[52, 40, 26], [64, 48, 30], [44, 34, 22], [74, 58, 36]];
      for (let y = by; y < by + bh - 22; y += 3.4) for (let x = bx; x < bx + bw; x += 3.4) {
        const edge = Math.min(x - bx, bx + bw - x, y - by, by + bh - 22 - y);
        if (Math.random() > Math.min(0.9, edge / 14)) continue;
        soil.push([x + rnd(-1, 1), y + rnd(-1, 1), earth[(Math.random() * 4) | 0]]);
      }
      for (let r = 0; r < rows; r++) {
        const gy = by + ch * (r + 1) - 4;
        for (let x = bx + 8; x < bx + bw - 8; x += 2.6) if (Math.random() < 0.55) soil.push([x, gy + rnd(-2, 4), [[110, 82, 51], [130, 100, 64]][(Math.random() * 2) | 0]]);
      }
      const label = el('div', 'bedlabel');
      const dot = el('i'); dot.style.background = `rgb(${BED_COLORS[bi].join(',')})`;
      const name = el('span'); name.dataset.i18n = 'bed' + bi; name.textContent = t('bed' + bi);
      label.append(dot, name, ` · ${list.length}`);
      if (!list.length) { const em = el('span', 'empty'); em.dataset.i18n = 'bedEmpty'; em.textContent = t('bedEmpty'); label.append(em); }
      label.style.left = bx + bw / 2 + 'px'; label.style.top = by + bh - 16 + 'px';
      bedsEl.append(label);
      list.sort((a, b) => new Date(a.e.date) - new Date(b.e.date)).forEach((post, i) => {
        const c = i % cols, r = (i / cols) | 0;
        const shape = growPlant(post.stage, BED_COLORS[bi]);
        const scale = Math.min(1.3, (ch - 6) / (shape.h + 6), cw / (shape.w + 6));
        const p = { ...shape, post, x: bx + cw * (c + 0.5) + rnd(-cw * 0.12, cw * 0.12), y: by + ch * (r + 1), scale, delay: i * 70 + bi * 160, hover: false, hk: 0 };
        post.plant = p;
        const hit = el('button', 'plant-hit');
        hit.type = 'button'; hit.setAttribute('aria-label', post.e.title);
        Object.assign(hit.style, { left: p.x - p.w * scale / 2 + 'px', top: p.y - p.h * scale + 'px', width: p.w * scale + 'px', height: p.h * scale + 'px' });
        hit.onmouseenter = hit.onfocus = () => { p.hover = true; showTip(p); };
        hit.onmouseleave = hit.onblur = () => { p.hover = false; ptip.classList.remove('on'); };
        hit.onclick = () => openReader(post);
        bedsEl.append(hit);
        plants.push(p);
      });
    });
  }

  function showTip(p) {
    const k = el('span', 'k'); k.textContent = `${t('bed' + p.post.bed)} · ${t('stage' + p.post.stage)}`;
    const d = el('span', 'd'); d.textContent = p.post.e.date || '';

    ptip.style.left = Math.max(140, Math.min(W - 140, p.x)) + 'px';

  function setNurseryActive(on) {
    nurseryOn = on;

  function put(X, Y, s, r, g, b) {
    if (X < 0 || Y < 0 || X + s >= W || Y + s >= H) return;
    const c = (255 << 24) | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0);
    for (let yy = 0; yy < s; yy++) { const row = (Y + yy) * W + X; for (let xx = 0; xx < s; xx++) img32[row + xx] = c; }
  }
  function drawSoil() {
    if (!nurseryOn || morphStart >= 0) return;
    for (const [x, y, c] of soil) put(x | 0, y | 0, 3, c[0], c[1], c[2]);
  }
  function drawPlants(now) {
    if (!nurseryOn || morphStart >= 0) return;
    const age = now - nurseryT0;
    for (const p of plants) {
      const gr = Math.max(0, Math.min(1, (age - p.delay) / 900));
      if (!gr) continue;
      p.hk += ((p.hover ? 1 : 0) - p.hk) * 0.15;
      const e = (reduce ? 1 : easeOutBack(gr)) * p.scale * (1 + 0.14 * p.hk);
      const sway = reduce ? 0 : Math.sin(now * 0.0016 + p.x * 0.02) * 3 * gustAt(p.x, now) * calmK;
      for (const [dx, dy, r, g, b, s] of p.dots) {
        const lift = -dy / p.h;   // tops sway more than roots
        const k = 0.28 * p.hk;
        put((p.x + dx * e + sway * lift) | 0, (p.y + dy * e) | 0, s, r + (255 - r) * k, g + (245 - g) * k, b + (215 - b) * k);
      }
    }
  }

  // Reading view: Notion blocks rendered as plain DOM (never innerHTML).
  const reader = document.getElementById('reader');
  function richNodes(b) {
    return (b.rich_text || []).map(r => {
      let n = document.createTextNode(r.text || '');
      if (r.code) n = el('code', '', [n]);
      if (r.bold) n = el('strong', '', [n]);
      if (r.italic) n = el('em', '', [n]);
      if (r.href && /^https?:/.test(r.href)) { const a = el('a', '', [n]); a.href = r.href; a.target = '_blank'; a.rel = 'noopener noreferrer'; n = a; }
      return n;
    });
  }
  function renderBlocks(e) {
    const out = [];
    let list = null, listType = '';
    const blocks = Array.isArray(e.blocks) && e.blocks.length ? e.blocks : String(e.body || '').split(/\n+/).map(text => ({ type: 'paragraph', rich_text: [{ text }] }));
    for (const b of blocks) {
      const isList = b.type === 'bulleted_list_item' || b.type === 'numbered_list_item';
      if (isList) {
        const tag = b.type === 'bulleted_list_item' ? 'ul' : 'ol';
        if (!list || listType !== tag) { list = el(tag); listType = tag; out.push(list); }
        list.append(el('li', '', richNodes(b)));
        continue;
      }
      list = null;
      if (b.type === 'paragraph') { if (richText(b).trim()) out.push(el('p', '', richNodes(b))); }
      else if (b.type === 'heading_1') out.push(el('h2', '', richNodes(b)));
      else if (b.type === 'heading_2') out.push(el('h3', '', richNodes(b)));
      else if (b.type === 'heading_3') out.push(el('h4', '', richNodes(b)));
      else if (b.type === 'quote') out.push(el('blockquote', '', richNodes(b)));
      else if (b.type === 'code') out.push(el('pre', '', [richText(b)]));
      else if (b.type === 'divider') out.push(el('hr'));
    }
    return out;
  }
  function openReader(post) {
    const { e } = post;
    document.getElementById('readerMeta').textContent = `${t('bed' + post.bed)} · ${t('stage' + post.stage)} · ${e.date || ''}`;
    document.getElementById('readerTitle').textContent = e.title;
    const tags = Array.isArray(e.tags) ? e.tags : [];
    document.getElementById('readerTags').replaceChildren(...tags.map(tag => el('span', '', [tag])));
    document.getElementById('readerBody').replaceChildren(...renderBlocks(e));
    // Follow the vines: other pieces that cite the same cases or statutes.
    const rel = [...(post.related || new Map())].sort((a, b) => b[1].length - a[1].length);
    document.getElementById('readerRelated').replaceChildren(...(rel.length ? [el('h4', '', [t('related')]), ...rel.map(([other, refs]) => {
      const b = el('button'); b.type = 'button';
      b.append(other.e.title, el('small', '', [t('citesShared') + refs.map(refLabel).join(lang === 'zh' ? '、' : ', ')]));
      b.onclick = () => openReader(other);
      return b;
    })] : []));
    reader.querySelector('.sheet').scrollTop = 0;
    reader.classList.add('on'); readerOpen = true; ptip.classList.remove('on');
    const pid = e.notionPageId || e.id;
    if (pid) history.replaceState(null, '', '#/post/' + pid);
    document.getElementById('readerClose').focus();
  }
  function closeReader() {
    if (!readerOpen) return;
    reader.classList.remove('on'); readerOpen = false;
    if (POST_LINK.test(location.hash)) history.replaceState(null, '', studyOpen ? '#/study' : '#/' + SCENES[current].id);
  }
  document.getElementById('readerClose').onclick = closeReader;
  reader.onclick = e => { if (e.target === reader) closeReader(); };

  async function loadWriting() {
    const data = await fetch('notion-posts.json').then(r => r.ok ? r.json() : { entries: [] }).catch(() => ({ entries: [] }));
    // Skip untitled entries and placeholders ("(No content yet)" test posts).
    posts = (data.entries || []).map(e => ({ e, bed: bedOf(e.section), n: textLength(e) }))
      .filter(p => p.bed >= 0 && p.e.title && p.n >= 200)
      .map(p => ({ ...p, stage: maturity(p.n) }));
    linkWriting();
    layoutNursery();
    buildFinds();
    if (studyOpen) renderStudy();
    openPostLink();
  }

  // ─── 工具棚 Projects: each tool is a carved garden boulder with a lamp that shows whether it's awake ──
  const TOOLS = [
    { href: 'https://housekeeper-2kp7.onrender.com/', external: true, name: 'Housekeeper', tag: 'hkTag', desc: 'hkDesc', state: 'checking' },
    { href: 'news-radar.html', external: false, nameKey: 'radarName', tag: 'radarTag', desc: 'radarDesc', state: 'checking', demo: 'news' },
  ];
  const stelesEl = document.getElementById('steles');
  let stones = [], projectsOn = false, projectsT0 = 0, pinged = false;
  const STONE = [[150, 156, 150], [170, 176, 168], [190, 194, 184], [208, 210, 198], [224, 224, 212]];
  const MOSS = [[70, 104, 52], [96, 132, 60], [120, 150, 70]];

  function layoutProjects() {
    if (!W) return;
    stones = []; stelesEl.replaceChildren();
    const title = document.querySelector('[data-id="projects"] .center-title').getBoundingClientRect();
    const wide = W >= 760, gap = 28;
    const sw = wide ? Math.min(380, (W - 64 - gap) / 2) : Math.min(440, W - 32);
    const sh = wide ? Math.min(300, H - title.bottom - 100) : Math.min(240, (H - title.bottom - 48 - gap) / 2);
    TOOLS.forEach((tool, i) => {
      const x = wide ? W / 2 + (i - 0.5) * (sw + gap) - sw / 2 : (W - sw) / 2;
      const y = wide ? H - 52 - sh : title.bottom + 32 + i * (sh + gap);
      const dots = [], waist = sh * 0.6;
      // A rounded garden boulder: domed top, flatter base, lumpy outline; lit from the top left, mossy at the foot.
      for (let ly = 0; ly < sh; ly += 2.2) for (let lx = -sw / 2; lx < sw / 2; lx += 2.2) {
        const u = lx / (sw / 2), v = ly < waist ? (waist - ly) / waist : (ly - waist) / (sh - waist);
        const th = Math.atan2(ly - waist, lx), lump = 1 + 0.05 * Math.sin(3 * th + i * 2) + 0.03 * Math.sin(7 * th + i);
        if (Math.abs(u) ** 2.4 + v ** (ly < waist ? 2.1 : 3.2) > lump) continue;
        const l = Math.max(0, Math.min(0.999, 0.62 - u * 0.2 - (ly / sh) * 0.32 + rnd(-0.12, 0.12)));
        const moss = Math.random() < ((ly / sh) - 0.68) * 1.2;
        dots.push([lx + rnd(-0.8, 0.8), ly + rnd(-0.8, 0.8), moss ? MOSS[(Math.random() * 3) | 0] : STONE[(l * 5) | 0]]);
      }
      // Grass tufts where the stone meets the ground.
      for (let k = 0; k < 140; k++) dots.push([rnd(-sw / 2 - 10, sw / 2 + 10), sh - rnd(0, 12), [[90, 125, 40], [127, 168, 58], [64, 100, 44]][(Math.random() * 3) | 0]]);
      const stone = { tool, x, y, sw, sh, dots, hover: false, hk: 0, delay: i * 180 };
      stones.push(stone);

      const lamp = el('span', 'lamp'); lamp.dataset.state = tool.state;
      const st = el('span'); st.dataset.i18n = 'st_' + tool.state; st.textContent = t('st_' + tool.state);
      const h3 = el('h3'); if (tool.nameKey) { h3.dataset.i18n = tool.nameKey; h3.textContent = t(tool.nameKey); } else h3.textContent = tool.name;
      const tl = el('p', 'tl'); tl.dataset.i18n = tool.tag; tl.textContent = t(tool.tag);
      const ds = el('p', 'ds'); ds.dataset.i18n = tool.desc; ds.textContent = t(tool.desc);
      const status = el('span', 'status', [lamp, st]);
      let a;
      if (tool.demo === 'news') {
        // Click the stone (or the button) and its face turns into a ticker of the radar's real headlines.
        const ticker = el('div', 'ticker');
        const toggle = el('button', 'toggle'); toggle.type = 'button';
        const link = el('a', 'go'); link.href = tool.href; link.dataset.i18n = 'openRadar'; link.textContent = t('openRadar');
        a = el('div', 'stele demo', [status, h3, el('div', 'face', [tl, ds]), ticker, el('div', 'foot', [toggle, link])]);
        const sync = () => {
          toggle.dataset.i18n = tool.open ? 'demoClose' : 'demoNews'; toggle.textContent = t(toggle.dataset.i18n);
          toggle.setAttribute('aria-expanded', String(!!tool.open));
          a.classList.toggle('open', !!tool.open);
          if (tool.open) fillTicker(ticker);
        };
        a.onclick = e => { if (e.target.closest('a')) return; tool.open = !tool.open; stone.openAt = performance.now(); sync(); };
        tool.refresh = () => tool.open && fillTicker(ticker);
        sync();
      } else {
        const go = el('span', 'go'); go.dataset.i18n = 'open'; go.textContent = t('open');
        a = el('a', 'stele', [status, h3, tl, ds, go]);
        a.href = tool.href;
        if (tool.external) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      }
      Object.assign(a.style, { left: x + 'px', top: y + 'px', width: sw + 'px', height: sh + 'px', paddingTop: sh * 0.17 + 'px', paddingBottom: sh * 0.12 + 'px', paddingLeft: sw * 0.13 + 'px', paddingRight: sw * 0.13 + 'px' });
      a.onmouseenter = a.onfocus = () => { stone.hover = true; };
      a.onmouseleave = a.onblur = () => { stone.hover = false; };
      tool.lampEl = lamp; tool.stEl = st;

  }

  function setLamp(tool, state) {
    tool.state = state;
    if (tool.lampEl) { tool.lampEl.dataset.state = state; tool.stEl.dataset.i18n = 'st_' + state; tool.stEl.textContent = t('st_' + state); }
  }
  // Knock once per visit; an opaque reply means the tool answered. Render's free tier may need a while to wake.
  function pingTools() {
    if (pinged) return;
    pinged = true;
    for (const tool of TOOLS) {
      const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 9000);
      fetch(tool.href, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
        .then(() => setLamp(tool, 'live'), () => setLamp(tool, 'sleep'))
        .finally(() => clearTimeout(timer));
    }
  }
