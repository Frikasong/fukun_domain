    projectsOn = on;
    if (on) { projectsT0 = performance.now(); layoutProjects(); pingTools(); }
  }

  // Stones rise out of the ground when the scene arrives.
  // ─── 雷达: the radar stone's live headlines (news-feed.json, refreshed by GitHub Actions) ──
  let news = null;
  const fmtDate = v => { const d = new Date(v); return isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()}`; };
  async function loadNews() {
    if (news) return news;
    const d = await fetch('news-feed.json').then(r => r.ok ? r.json() : null).catch(() => null);
    // Feed URLs arrive with HTML entities in them (e.g. &#45; for "-").
    const decode = u => String(u || '').replace(/&#45;/g, '-').replace(/&amp;/g, '&');
    const pick = arr => (arr || []).filter(x => x.title && /^https?:/.test(decode(x.url)))
      .map(x => ({ title: x.title, url: decode(x.url), source: x.source || '', at: x.publishedAt || '' }))
      .sort((a, b) => new Date(b.at) - new Date(a.at));
    news = { na: pick(d && d.panels && d.panels.na), cn: pick(d && d.panels && d.panels.cn), at: (d && d.generatedAt) || '' };
    return news;
  }
  async function fillTicker(box) {
    if (box.dataset.lang === lang && box.childElementCount) return;
    box.dataset.lang = lang;
    box.replaceChildren(el('p', 'note', [t('newsLoading')]));
    const n = await loadNews();
    // Chinese readers see the China stream first; English readers see North America first.
    const list = (lang === 'zh' ? [...n.cn, ...n.na] : [...n.na, ...n.cn]).slice(0, 24);
    if (!list.length) { box.replaceChildren(el('p', 'note', [t('newsEmpty')])); return; }
    const row = it => {
      const a = el('a', 'headline'); a.href = it.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      const src = el('span', 'src'); src.textContent = [it.source, fmtDate(it.at)].filter(Boolean).join(' · ');
      const ht = el('span', 'ht'); ht.textContent = it.title;
      a.append(src, ht);
      return a;
    };
    const roll = el('div', 'roll');
    roll.append(...list.map(row));
    // A second copy makes the roll seamless; hide it from keyboard and screen readers.
    const dup = list.map(row); dup.forEach(x => { x.tabIndex = -1; x.setAttribute('aria-hidden', 'true'); });
    roll.append(...dup);
    roll.style.animationDuration = list.length * 3.4 + 's';
    const upd = el('p', 'updated'); upd.textContent = `${t('newsUpdated')} ${fmtDate(n.at)}`;
    box.replaceChildren(el('div', 'window', [roll]), upd);
  }

  // A tiny radar in stipple: a ring, a turning sweep, and blips that light as it passes.
  function drawRadar(x, y, r, now, a) {
    const ang = now * 0.0028;
    for (let t0 = 0; t0 < 6.283; t0 += 0.22) put((x + Math.cos(t0) * r) | 0, (y + Math.sin(t0) * r) | 0, 2, 64, 92, 60);
    for (let k = 0; k < 7; k++) {
      const aa = ang - k * 0.13, f = (1 - k / 7) * a;
      for (let d = 2; d < r; d += 2) put((x + Math.cos(aa) * d) | 0, (y + Math.sin(aa) * d) | 0, 2, 60 + 60 * f, 110 + 110 * f, 60 + 40 * f);
    }
    for (const [ba, bd] of [[0.8, 0.55], [2.6, 0.75], [4.4, 0.4], [5.5, 0.85]]) {
      const since = ((ang - ba) % 6.283 + 6.283) % 6.283;
      if (since < 1.2) { const f = (1 - since / 1.2) * a; put((x + Math.cos(ba) * r * bd) | 0, (y + Math.sin(ba) * r * bd) | 0, 3, 90 + 150 * f, 140 + 115 * f, 80 + 60 * f); }
    }
  }

  function drawStones(now) {
    if (!projectsOn || morphStart >= 0) return;
    for (const s of stones) {
      const gr = Math.max(0, Math.min(1, (now - projectsT0 - s.delay) / 800)), rise = (1 - (1 - gr) ** 3) * s.sh;
      s.hk += ((s.hover || s.tool.open ? 1 : 0) - s.hk) * 0.12;
      const k = 0.12 * s.hk, cx = s.x + s.sw / 2;
      for (const [lx, ly, c] of s.dots) {
        const Y = s.y + ly + (s.sh - rise);
        if (Y > s.y + s.sh) continue;
        put((cx + lx) | 0, Y | 0, 3, c[0] + (255 - c[0]) * k, c[1] + (250 - c[1]) * k, c[2] + (225 - c[2]) * k);
      }
      if (s.tool.open && gr >= 1) {
        const a = Math.min(1, (now - (s.openAt || 0)) / 500);
        drawRadar(cx + s.sw * 0.3, s.y + s.sh * 0.3, Math.min(18, s.sw * 0.05), now, a);
      }
    }
  }

  // ─── 昼夜与季节: the garden follows the visitor's own clock and calendar ──
  // Preview other moments with ?time=dawn|day|dusk|night and ?season=spring|summer|autumn|winter.
  const MOMENT = (() => {
    const q = new URLSearchParams(location.search), d = new Date(), h = d.getHours() + d.getMinutes() / 60, m = d.getMonth();
    const time = q.get('time') || (h >= 5 && h < 8 ? 'dawn' : h >= 8 && h < 17 ? 'day' : h >= 17 && h < 20 ? 'dusk' : 'night');
    // Seasons as the northern hemisphere has them (the garden's home is Toronto).
    const season = q.get('season') || (m >= 2 && m <= 4 ? 'spring' : m >= 5 && m <= 7 ? 'summer' : m >= 8 && m <= 10 ? 'autumn' : 'winter');
    return { time, season };
  })();
  const TIME_TONE = { dawn: [1, 0.96, 1.04, 12, 6, 16], day: [1, 1, 1, 0, 0, 0], dusk: [1.12, 0.9, 0.76, 18, 4, -4], night: [0.42, 0.52, 0.8, 4, 10, 30] };
  const M = new Float32Array(3);
  // Re-colour one sampled dot for the season, then for the time of day (result in M).
  function atMoment(r, g, b, x, y) {
    const l = 0.3 * r + 0.59 * g + 0.11 * b;
    if (MOMENT.season === 'autumn' && g > r && g > b) {
      // Foliage turns in patches: some gold, some rust, some still green.
      const patch = Math.sin(x * 0.031 + y * 0.017) * 0.5 + Math.sin(x * 0.007 - y * 0.023) * 0.5;
      const k = Math.min(1, (g - Math.max(r, b)) / 60) * Math.max(0, patch * 0.8 + 0.45);
      r += (g * 1.08 + 20 - r) * k; g -= g * 0.18 * k; b -= b * 0.45 * k;
    } else if (MOMENT.season === 'winter') {
      r = l + (r - l) * 0.5 + 14; g = l + (g - l) * 0.5 + 16; b = l + (b - l) * 0.5 + 24;
    } else if (MOMENT.season === 'spring') {
      r += 6; b += 4;
    } else if (MOMENT.season === 'summer') {
      r = l + (r - l) * 1.08; g = l + (g - l) * 1.08; b = l + (b - l) * 1.08;
    }
    const T = TIME_TONE[MOMENT.time] || TIME_TONE.day;
    M[0] = clamp(r * T[0] + T[3]); M[1] = clamp(g * T[1] + T[4]); M[2] = clamp(b * T[2] + T[5]);
  }

  // Ambient life for the moment: leaves in autumn, snow in winter, petals in spring, seeds in summer; fireflies on warm nights.
  const MOTE = { autumn: 'leaf', winter: 'snow', spring: 'petal', summer: 'seed' }[MOMENT.season] || 'seed';
  const FIREFLIES = MOMENT.time === 'night' && MOMENT.season !== 'winter';
  const MOTE_COLORS = { leaf: [[214, 120, 40], [176, 82, 34], [226, 170, 58], [150, 96, 44]], petal: [[244, 186, 204], [250, 214, 224]], snow: [[240, 244, 246]], seed: [[238, 236, 222]] };
  let motes = [];
  function newMote(kind, scatter) {
    const cs = MOTE_COLORS[kind] || [[232, 255, 150]];
    return { kind, x: rnd(-20, W + 20), y: scatter ? rnd(0, H) : -10, ph: rnd(0, 6.28), c: cs[(Math.random() * cs.length) | 0],
             vy: kind === 'snow' ? rnd(18, 40) : rnd(14, 28), s: kind === 'snow' && Math.random() < 0.7 ? 2 : 3 };
  }
  function seedMotes() {
    motes = [];
    const n = Math.round({ leaf: 16, snow: 70, petal: 16, seed: 10 }[MOTE] * (LITE ? 0.6 : 1));
    for (let i = 0; i < n; i++) motes.push(newMote(MOTE, true));
    if (FIREFLIES) for (let i = 0; i < (LITE ? 12 : 22); i++) motes.push(newMote('firefly', true));
  }
  function tickMotes(now, dt) {
    if (reduce || morphStart >= 0) return;
    for (const p of motes) {
      if (p.kind === 'firefly') {
        // Fireflies wander about their spot and pulse.
        p.x += Math.sin(now * 0.0006 + p.ph) * 0.6; p.y += Math.cos(now * 0.0005 + p.ph * 1.3) * 0.45;
        const k = Math.max(0, Math.sin(now * 0.002 + p.ph * 3));
        if (k > 0.05) { glow(p.x, p.y, 12, 0.55 * k, [232, 255, 150]); put(p.x | 0, p.y | 0, 2, 240, 255, 170); }
        continue;
      }
      const g = gustAt(p.x, now), snow = p.kind === 'snow';
      p.y += p.vy * dt * calmK;
      p.x += (Math.sin(now * 0.0012 + p.ph) * (snow ? 10 : 22) + g * (snow ? 8 : 16)) * dt * calmK;
      if (p.kind === 'leaf' || p.kind === 'petal') {
        // A small cluster that tumbles as it falls.
        const a = now * 0.003 + p.ph;
        for (let j = 0; j < 4; j++) put((p.x + Math.cos(a + j * 1.6) * 2.4) | 0, (p.y + Math.sin(a + j * 1.6) * 1.2) | 0, 2, p.c[0], p.c[1], p.c[2]);
      } else put(p.x | 0, p.y | 0, p.s, p.c[0], p.c[1], p.c[2]);
      if (p.y > H + 10 || p.x > W + 30 || p.x < -30) Object.assign(p, newMote(p.kind, false));
    }
  }

  // ─── 风: each gust carries a handful of petals across the garden ─────────
  let petals = [];
  function tickGust(now, dt) {
    if (reduce) return;
    if (!gust && now > nextGust && morphStart < 0) {
      gust = { t0: now };
      for (let i = 0; i < (W < 700 ? 22 : 40); i++)
        petals.push({ x: rnd(-300, -20), y: rnd(H * 0.05, H * 0.9), vx: rnd(310, 370), ph: rnd(0, 6.28), c: PETALS[(Math.random() * PETALS.length) | 0] });
    }
    if (gust && gustFront(now) > W + 300) { gust = null; nextGust = now + rnd(14000, 26000); }
    for (const p of petals) {
      p.x += p.vx * dt; p.y += Math.sin(now * 0.004 + p.ph) * 0.8 + 8 * dt;
      put(p.x | 0, p.y | 0, 3, p.c[0], p.c[1], p.c[2]);
    }
    petals = petals.filter(p => p.x < W + 10);
  }

  // ─── 拾遗: things hidden in the About garden, found by wandering ─────────
  // Spots are fixed points in the source image, so finds stay in the same place between visits.
  const FIND_SPOTS = [[150, 150], [700, 110], [905, 300], [260, 330], [80, 440], [560, 250], [985, 520], [60, 860], [420, 930], [900, 640], [330, 600], [820, 930]];
  const KIND_COLOR = { project: [214, 214, 200], writing: [120, 160, 225], photo: [246, 236, 214], music: [242, 177, 58], video: [255, 168, 80], poem: [226, 232, 214] };
  const findCard = document.getElementById('findCard');
  const jBtn = document.getElementById('journalBtn'), jPanel = document.getElementById('jPanel');
  let finds = [], found = new Set(), nearFind = null, nearSince = 0, cardFind = null, cardHover = false;
  try { found = new Set(JSON.parse(localStorage.getItem('garden-found') || '[]')); } catch {}
  const saveFound = () => { try { localStorage.setItem('garden-found', JSON.stringify([...found])); } catch {} };

  const findTitle = f => f.kind === 'project' ? (f.tool.nameKey ? t(f.tool.nameKey) : f.tool.name) : f.kind === 'poem' ? t('poemTitle') : f.item.e.title || '';
  function openFind(f) {
    if (f.kind === 'project') location.hash = '/projects';
    else if (f.kind === 'writing') openReader(f.item);
    else if (f.kind === 'poem') showPoem();
    else openItem(f.item);
  }

  async function buildFinds() {
    if (!W || !posts.length || !photos.length) return;   // wait until both feeds are in
    const writing = [...posts].sort((a, b) => b.stage - a.stage || b.n - a.n).slice(0, 3);
    const list = [
      ...TOOLS.map((tool, i) => ({ kind: 'project', key: 'project:' + i, tool })),
      ...writing.map(p => ({ kind: 'writing', key: 'writing:' + (p.e.notionPageId || p.e.title), item: p })),
      ...photos.slice(0, 3).map(p => ({ kind: 'photo', key: 'photo:' + (p.e.instagramId || p.e.id), item: p })),
      ...tracks.slice(0, 2).map(p => ({ kind: 'music', key: 'music:' + (p.e.notionPageId || p.e.title), item: p })),
      ...videos.slice(0, 1).map(p => ({ kind: 'video', key: 'video:' + p.id, item: p })),
      { kind: 'poem', key: 'poem' },
    ].slice(0, FIND_SPOTS.length);
    const im = await loadShape(), { sx, sy, sw, sh } = cropRect(SCENES[0], im);
    finds = list.map((f, i) => {
      let x = (FIND_SPOTS[i][0] - sx) / sw * W, y = (FIND_SPOTS[i][1] - sy) / sh * H;
      x = Math.max(28, Math.min(W - 28, x)); y = Math.max(84, Math.min(H - 70, y));
      // Keep clear of the title in the middle.
      if (Math.abs(x - W / 2) < Math.min(300, W * 0.4) && Math.abs(y - H * 0.47) < 90) y += y < H * 0.47 ? -110 : 110;
      return { ...f, x, y, ph: rnd(0, 6), at: found.has(f.key) ? -1e9 : 0, spot: FIND_SPOTS[i] };
    });
    updateJournal();
  }

  function senseFinds(x, y) {
    let best = null, bd = 1e9;
    for (const f of finds) { const d = Math.hypot(f.x - x, f.y - y); if (d < bd) { bd = d; best = f; } }
    if (best && bd < 46) { if (nearFind !== best) { nearFind = best; nearSince = performance.now(); } }
    else nearFind = null;
    if (best && found.has(best.key) && bd < 30) { if (cardFind !== best) showFindCard(best, false); }
    else if (cardFind && !cardHover && Math.hypot(cardFind.x - x, cardFind.y - y) > 130) hideFindCard();
  }

  function reveal(f, now) {
    found.add(f.key); saveFound(); f.at = now;
    showFindCard(f, true); updateJournal(true);
    // Finding everything sends a skein of geese over the garden.
    if (finds.every(g => found.has(g.key))) setTimeout(() => startGoose(performance.now(), true), 1200);
  }

  function showFindCard(f, fresh) {
    const k = el('span', 'k'); k.textContent = fresh ? `${t('foundK')} · ${t('k_' + f.kind)}` : t('k_' + f.kind);
    const ttl = el('span', 'ttl'); ttl.textContent = findTitle(f);
    const b = el('button'); b.type = 'button'; b.textContent = t('open2'); b.onclick = () => { hideFindCard(); openFind(f); };
    findCard.replaceChildren(k, ttl, el('br'), b);
    findCard.style.left = Math.max(140, Math.min(W - 140, f.x)) + 'px';
    findCard.style.top = Math.max(150, f.y) + 'px';
    findCard.classList.add('on'); cardFind = f;
  }
  function hideFindCard() { findCard.classList.remove('on'); cardFind = null; cardHover = false; }
  findCard.onmouseenter = () => { cardHover = true; };
  findCard.onmouseleave = () => { cardHover = false; };

  function drawFinds(now) {
    if (current !== 0 || morphStart >= 0 || !stages[0].classList.contains('on')) return;
    // Lingering near a hidden spot for a moment reveals it.
    if (nearFind && !found.has(nearFind.key) && now - nearSince > 380) reveal(nearFind, now);
    for (const f of finds) {
      const c = KIND_COLOR[f.kind];
      if (!found.has(f.key)) {
        // A faint glint every few seconds is the only hint.
        const tt = (now / 1000 + f.ph * 1.7) % 6.5;
        if (tt < 0.9 && !reduce) {
          const k = Math.sin(tt / 0.9 * Math.PI);
          glow(f.x, f.y, 16, 0.4 * k, [255, 244, 210]);
          for (let r = -7; r <= 7; r += 2) { put((f.x + r * k) | 0, f.y | 0, 2, 255, 248, 220); put(f.x | 0, (f.y + r * k) | 0, 2, 255, 248, 220); }
        }
        continue;
      }
      const age = now - f.at;
      if (age < 1100) {
        const p = age / 1100;
        glow(f.x, f.y, 60, 0.5 * (1 - p), [255, 240, 200]);
        for (let i = 0; i < 24; i++) { const a = i / 24 * 6.283 + f.ph, r = 6 + p * 46; put((f.x + Math.cos(a) * r) | 0, (f.y + Math.sin(a) * r - p * 10) | 0, 3, c[0], c[1], c[2]); }
      }
      // What you found stays in the garden as a small glowing bloom.
      glow(f.x, f.y, 22, 0.22 + 0.08 * Math.sin(now * 0.003 + f.ph), c);
      for (let i = 0; i < 14; i++) { const a = i * 2.4 + f.ph, r = 2 + (i % 4) * 1.6; put((f.x + Math.cos(a) * r) | 0, (f.y + Math.sin(a) * r) | 0, 3, c[0], c[1], c[2]); }
    }
  }

  function updateJournal(pulse) {
    document.getElementById('jCount').textContent = finds.filter(f => found.has(f.key)).length;
    document.getElementById('jTotal').textContent = '/' + finds.length;
    if (pulse) { jBtn.classList.remove('pulse'); void jBtn.offsetWidth; jBtn.classList.add('pulse'); }
    if (jPanel.classList.contains('on')) renderJournal();
  }
  function renderJournal() {
    const done = finds.length > 0 && finds.every(f => found.has(f.key));
    document.getElementById('jNote').textContent = t(done ? 'journalDone' : 'journalNote');
    document.getElementById('jList').replaceChildren(...finds.map(f => {
      if (!found.has(f.key)) return el('li', 'hidden', [el('span', 'k', ['?']), t('unfound')]);
      const k = el('span', 'k'); k.textContent = t('k_' + f.kind);
      const b = el('button'); b.type = 'button'; b.textContent = findTitle(f); b.onclick = () => openFind(f);
      return el('li', '', [k, b]);
    }));
  }
  jBtn.onclick = () => {
    const on = !jPanel.classList.contains('on');
    jPanel.classList.toggle('on', on); jBtn.setAttribute('aria-expanded', String(on));
    if (on) renderJournal();
  };
  document.getElementById('jReset').onclick = () => { found.clear(); saveFound(); hideFindCard(); updateJournal(); renderJournal(); };

  // ─── 飞鸿踏雪泥: a goose glides in, walks the lawn leaving prints, and flies on ──
  let geese = [], lastMove = performance.now(), nextGoose = performance.now() + 14000, poemTimer;
  const poemEl = document.getElementById('poem');
  function showPoem() {
    poemEl.classList.add('on'); clearTimeout(poemTimer);
    poemTimer = setTimeout(() => poemEl.classList.remove('on'), 7000);
  }
  // The goose in local space (facing right): stippled body, dark neck and head, white cheek, one wing.
  const GOOSE = (() => {
    const body = [], head = [], wing = [];
    for (let i = 0; i < 160; i++) { const a = rnd(0, 6.283), r = Math.sqrt(Math.random()); body.push([Math.cos(a) * r * 13, Math.sin(a) * r * 5.5, i % 3]); }
    for (let i = 0; i < 20; i++) { const a = rnd(0, 6.283), r = Math.sqrt(Math.random()) * 3; head.push([19 + Math.cos(a) * r, -14 + Math.sin(a) * r * 0.8]); }
    for (let i = 0; i < 120; i++) { const u = Math.random(), v = Math.random() * (1 - u); wing.push([u, v, i % 3]); }
    return { body, head, wing };
  })();
  const GOOSE_BODY = [[118, 108, 94], [140, 130, 114], [98, 90, 78]], GOOSE_DARK = [38, 34, 30], GOOSE_LEG = [196, 120, 58];

  async function startGoose(now, flock) {
    const im = await loadShape(), { sx, sy, sw, sh } = cropRect(SCENES[0], im);
    const S = W < 700 ? 1.6 : 2;
    if (flock) {
      geese = Array.from({ length: 7 }, (_, i) => {
        const row = Math.ceil(i / 2), side = i % 2 ? 1 : -1;
        return { flock: true, t0: now + i * 60, S: S * 0.8, ox: -row * 46, oy: row * side * 24, y0: H * 0.16 };
      });
      showPoem();
    } else {
      // Land on the open lawn in front of the figure on the rock.
      const land = { x: Math.max(60, Math.min(W - 280, (650 - sx) / sw * W)), y: (640 - sy) / sh * H };
      geese = [{ t0: now, S, land }];
    }
  }

  function goosePose(g, now) {
    const t = now - g.t0;
    if (t < 0) return null;
    if (g.flock) {
      const p = t / 9000;
      return p > 1 ? { done: true } : { x: -140 + p * (W + 380) + g.ox, y: g.y0 + g.oy + Math.sin(p * 6) * 6, flap: Math.sin(t * 0.012) };
    }
    const { land, S } = g;
    if (t < 3600) {
      // Glide in on a curve, flapping, then hold the wings still for the landing.
      const p = t / 3600, e = 1 - (1 - p) ** 2, u = 1 - e;
      const sx0 = -80, sy0 = H * 0.08, cx = land.x - 160, cy = H * 0.04;
      return { x: u * u * sx0 + 2 * u * e * cx + e * e * land.x, y: u * u * sy0 + 2 * u * e * cy + e * e * land.y, flap: p < 0.75 ? Math.sin(t * 0.014) : 0.3 - p * 0.3 };
    }
    if (t < 6600) {
      // Five steps across the lawn; each foot leaves a print.
      const st = (t - 3600) / 3000 * 5, i = Math.floor(st);
      if (g.stamped !== i && i < 5) {
        g.stamped = i;
        stampPrint(land.x + i * 26 * S - 6, land.y + 14 * S + (i % 2 ? 5 : -5), 0, now);
        if (i === 0) showPoem();
      }
      return { x: land.x + st * 26 * S, y: land.y - Math.abs(Math.sin(st * Math.PI)) * 2, flap: 0, walk: true, step: st };
    }
    const p = (t - 6600) / 2800, x0 = land.x + 130 * S;
    return p > 1 ? { done: true } : { x: x0 + p * p * (W + 200 - x0), y: land.y - p * (land.y - H * 0.06), flap: Math.sin(t * 0.016) };
  }

  function drawGoose(p, S) {
    const D = (x, y, c) => put((p.x + x * S) | 0, (p.y + y * S) | 0, 3, c[0], c[1], c[2]);
    for (const [x, y, ci] of GOOSE.body) D(x, y, GOOSE_BODY[ci]);
    for (let i = 0; i < 10; i++) D(-13 - i * 0.6, -1 + (i % 3) - 1, GOOSE_DARK);
    for (let s = 0; s < 1; s += 0.08) D(9 + s * 9, -2 - s * 11, GOOSE_DARK);
    for (const [x, y] of GOOSE.head) D(x, y, GOOSE_DARK);
    D(18.5, -13, [232, 228, 214]); D(23, -13.5, [70, 60, 50]); D(24.5, -13.5, [70, 60, 50]);
    if (p.walk) {
      const k = Math.sin(p.step * Math.PI * 2) * 3;
      for (let s = 0; s < 1; s += 0.15) { D(-2 + k * s, 5 + s * 8, GOOSE_LEG); D(2 - k * s, 5 + s * 8, GOOSE_LEG); }
    } else for (const [u, v, ci] of GOOSE.wing) D(4 - u * 14 - v * 4, -2 - (u * 22 * p.flap + v * 6), GOOSE_BODY[ci]);
  }

  function tickGoose(now) {
    if (reduce) return;
    // A goose comes by when the visitor stops to look for a while.
    if (!geese.length && current === 0 && morphStart < 0 && !readerOpen && now > nextGoose && now - lastMove > 5000 && stages[0].classList.contains('on')) {
      nextGoose = now + 45000;
      startGoose(now, false);
    }
    for (const g of geese) { g.pose = goosePose(g, now); if (g.pose && !g.pose.done) drawGoose(g.pose, g.S); }
    geese = geese.filter(g => !(g.pose && g.pose.done));
  }

  // ─── Old links: #/post/<id> from the classic site opens the piece it pointed to ──
  const POST_LINK = /^#\/post\/(.+)$/;
  function openPostLink() {
    const m = location.hash.match(POST_LINK);
    if (!m || readerOpen || lightbox.classList.contains('on')) return;
    const id = decodeURIComponent(m[1]), match = e => String(e.notionPageId) === id || String(e.id) === id;
    const post = posts.find(p => match(p.e));
    if (post) return openReader(post);
    const item = [...photos, ...tracks, ...videos].find(it => match(it.e));
    if (item) openItem(item);
  }

  // ─── 书房: every piece of content as a quiet list ────────────────────────
  const studyEl = document.getElementById('study');
  let studyOpen = false;
  function renderStudy() {
    document.getElementById('stProjects').replaceChildren(...TOOLS.map(tool => {
      const a = el('a'); a.href = tool.href; a.textContent = tool.nameKey ? t(tool.nameKey) : tool.name;
      if (tool.external) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      const meta = el('span', 'meta'); meta.textContent = t(tool.tag);
      const desc = el('span', 'desc'); desc.textContent = t(tool.desc);
      return el('li', '', [a, meta, desc]);
    }));
    document.getElementById('stWriting').replaceChildren(...[...posts].sort((a, b) => new Date(b.e.date) - new Date(a.e.date)).map(post => {
      const b = el('button'); b.type = 'button'; b.textContent = post.e.title; b.onclick = () => openReader(post);
      const meta = el('span', 'meta'); meta.textContent = `${t('bed' + post.bed)} · ${t('stage' + post.stage)} · ${post.e.date || ''}`;
      return el('li', '', [b, meta]);
    }));
    document.getElementById('stPhotos').replaceChildren(...photos.map(ph => {
      const img = el('img'); img.src = ph.img; img.alt = ph.e.title || ''; img.loading = 'lazy';
      const b = el('button', '', [img]); b.type = 'button'; b.title = ph.e.title || ''; b.onclick = () => openItem(ph);
      return b;
    }));
    document.getElementById('stMedia').replaceChildren(...[...tracks, ...videos].map(it => {
      const b = el('button'); b.type = 'button'; b.textContent = it.e.title || ''; b.onclick = () => openItem(it);
      const meta = el('span', 'meta'); meta.textContent = `${t(it.kind)} · ${it.e.date || ''}`;
      return el('li', '', [b, meta]);
    }));
  }
  function openStudy() {
    if (studyOpen) return;
    studyOpen = true; renderStudy(); studyEl.classList.add('on'); studyEl.scrollTop = 0;
    document.getElementById('studyClose').focus();
  }
  function closeStudy() { studyOpen = false; studyEl.classList.remove('on'); }
  // Leaving the study goes back to whichever corner of the garden you were in.
  function leaveStudy() { location.hash = '/' + SCENES[current].id; }
  document.getElementById('studyBtn').onclick = () => { location.hash = '/study'; };
  document.getElementById('skipBtn').onclick = () => { location.hash = '/study'; };
  document.getElementById('studyClose').onclick = leaveStudy;

  // ─── 足迹: every goose print is remembered, in source-image coordinates ──
  // All scenes are crops of one image, so one trail can span the whole garden.
  let srcW = 1024, srcH = 1024, trail = [], visited = new Set();
  try { trail = JSON.parse(localStorage.getItem('garden-trail') || '[]'); visited = new Set(JSON.parse(localStorage.getItem('garden-visited') || '[]')); } catch {}
  function markVisited(id) {
    if (visited.has(id)) return;
    visited.add(id);
    try { localStorage.setItem('garden-visited', JSON.stringify([...visited])); } catch {}
  }
  function recordTrail(x, y) {
    const { sx, sy, sw, sh } = cropRect(SCENES[current], { naturalWidth: srcW, naturalHeight: srcH });
    trail.push([Math.round(sx + x / W * sw), Math.round(sy + y / H * sh)]);
    if (trail.length > 800) trail.splice(0, trail.length - 800);
    if (trail.length % 10 === 0) { try { localStorage.setItem('garden-trail', JSON.stringify(trail)); } catch {} }
  }

  // ─── 地图: the garden from above, with the four corners, your trail and your finds ──
  const mapView = document.getElementById('mapView'), mapFrame = document.getElementById('mapFrame');
  const MAP_PINS = { about: [0.53, 0.74], projects: [0.72, 0.26], seedbed: [0.82, 0.62], fun: [0.24, 0.66] };
  let mapOpen = false;
  // The map is the whole garden stippled once, toned like an old, slightly faded map.
  let mapArtSize = 0;
  async function drawMapArt(size) {
    if (size === mapArtSize) return;
    const im = await loadArtwork();
    if (!im) return;
    const cv = document.getElementById('mapArt'), c = cv.getContext('2d');
    cv.width = size; cv.height = size;
    const off = document.createElement('canvas'); off.width = size; off.height = size;
    const o = off.getContext('2d'); o.drawImage(im, 0, 0, size, size);
    const px = o.getImageData(0, 0, size, size).data, out = c.createImageData(size, size), buf = new Uint32Array(out.data.buffer);
    buf.fill((255 << 24) | (BG[2] << 16) | (BG[1] << 8) | BG[0]);
    const step = 3.4;
    for (let gy = 0; gy < size; gy += step) for (let gx = 0; gx < size; gx += step) {
      const x = Math.min(size - 1, gx + Math.random() * step) | 0, y = Math.min(size - 1, gy + Math.random() * step) | 0, i = (y * size + x) * 4;
      const l = 0.3 * px[i] + 0.59 * px[i + 1] + 0.11 * px[i + 2];
      // Less saturated, a touch warmer and darker: an old map of the same garden.
      const r = clamp((l + (px[i] - l) * 0.72) * 0.92 + 14), g = clamp((l + (px[i + 1] - l) * 0.72) * 0.9 + 8), b = clamp((l + (px[i + 2] - l) * 0.72) * 0.84);
      const s = Math.random() < 0.5 ? 3 : 4, col = (255 << 24) | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0);
      for (let yy = 0; yy < s && y + yy < size; yy++) for (let xx = 0; xx < s && x + xx < size; xx++) buf[(y + yy) * size + x + xx] = col;
    }
    c.putImageData(out, 0, 0);
    mapArtSize = size;
  }

  function renderMap() {
    mapFrame.querySelectorAll('.pin, .mfind').forEach(n => n.remove());
    const size = mapFrame.clientWidth;
    drawMapArt(size);
    const cv = document.getElementById('mapTrail'), c = cv.getContext('2d');
    cv.width = size; cv.height = size; c.clearRect(0, 0, size, size);
    // Mist hangs over the parts of the garden you haven't walked; it clears around your footprints and the corners you've visited.
    c.fillStyle = 'rgba(14,30,18,.62)'; c.fillRect(0, 0, size, size);
    c.globalCompositeOperation = 'destination-out';
    const clear = (x, y, r) => {
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
    };
    for (const id of visited) { const [px, py] = MAP_PINS[id]; clear(px * size, py * size, size * 0.2); }
    for (const [ix, iy] of trail) clear(ix / srcW * size, iy / srcH * size, size * 0.07);
    c.globalCompositeOperation = 'source-over';
    document.getElementById('mapMoment').textContent = `${t('momentNow')}${lang === 'zh' ? '：' : ': '}${t('season_' + MOMENT.season)} · ${t('time_' + MOMENT.time)}`;
    // Footprints as small pale dots, in the same stipple as the map.
    c.fillStyle = 'rgba(250,246,236,.9)';
    for (const [ix, iy] of trail) c.fillRect((ix / srcW * size - 1.5) | 0, (iy / srcH * size - 1.5) | 0, 3, 3);
    for (const f of finds) {
      const d = el('span', 'mfind ' + (found.has(f.key) ? 'got' : 'unknown'), [found.has(f.key) ? '' : '?']);
      if (found.has(f.key)) { d.style.color = `rgb(${KIND_COLOR[f.kind].join(',')})`; d.title = findTitle(f); }
      d.style.left = f.spot[0] / srcW * 100 + '%'; d.style.top = f.spot[1] / srcH * 100 + '%';
      mapFrame.append(d);
    }
    SCENES.forEach((sc, i) => {
      const [px, py] = MAP_PINS[sc.id];
      const label = el('span'); label.textContent = t('place_' + sc.id);
      const pin = el('button', 'pin' + (i === current ? ' here' : ''), [label]);
      if (i === current) pin.append(el('small', '', [t('here')]));
      pin.type = 'button'; pin.style.left = px * 100 + '%'; pin.style.top = py * 100 + '%';
      pin.onclick = () => { closeMap(); location.hash = '/' + sc.id; };
      mapFrame.append(pin);
    });
  }
  function openMap() {
    if (mapOpen) return;
    mapOpen = true; mapView.classList.add('on');
    setTimeout(renderMap);
    document.getElementById('mapClose').focus();
  }
  function closeMap() { mapOpen = false; mapView.classList.remove('on'); }
  document.getElementById('mapBtn').onclick = () => (mapOpen ? closeMap() : openMap());
  document.getElementById('mapClose').onclick = closeMap;
  mapView.onclick = e => { if (e.target === mapView) closeMap(); };

  // ─── Stages, nav and hash routing (#/about, #/projects, #/fun) ───────────
  const stages = [...document.querySelectorAll('.stage')];
  // Wayfinding without a nav bar: where you are, and signposts to the corners on either side.
  const ring = i => (i + SCENES.length) % SCENES.length;
  function updateWayfinding(idx) {
    document.getElementById('wherePlace').textContent = t('place_' + SCENES[idx].id);
    document.getElementById('whereSec').textContent = t('sec_' + SCENES[idx].id);
    for (const [id, d] of [['signPrev', -1], ['signNext', 1]]) {
      const target = SCENES[ring(idx + d)], b = document.getElementById(id);
      const pl = el('span', 'pl', [t('place_' + target.id)]), ar = el('span', 'ar', [d < 0 ? '←' : '→']);
      b.replaceChildren(...(d < 0 ? [ar, pl] : [pl, ar]));
      b.setAttribute('aria-label', `${t('walkTo')} ${t('place_' + target.id)}`);
      b.onclick = () => { location.hash = '/' + target.id; };
    }
  }
  document.getElementById('whereBtn').onclick = () => openMap();
  // On touch screens, a quick horizontal swipe walks to the neighbouring corner.
  let swipe = null;
  addEventListener('touchstart', e => {
    const p = e.touches[0];
    swipe = e.touches.length === 1 && !e.target.closest('.study, .reader, .lightbox, .mapview, .jpanel, .bubble, .memory') ? { x: p.clientX, y: p.clientY, t: performance.now() } : null;
  }, { passive: true });
  addEventListener('touchend', e => {
    if (!swipe) return;
    const p = e.changedTouches[0], dx = p.clientX - swipe.x, dy = p.clientY - swipe.y, quick = performance.now() - swipe.t < 600;
    swipe = null;
    if (quick && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) location.hash = '/' + SCENES[ring(current + (dx < 0 ? 1 : -1))].id;
  }, { passive: true });
  let stageTimer;
  function showStage(idx, instant) {
    updateWayfinding(idx);
    document.documentElement.style.setProperty('--dir', travel);
    stages.forEach(s => s.classList.remove('on'));
    document.getElementById('veil').className = 'veil ' + SCENES[idx].veil;
    setFunActive(false); setMeNear(false, true); setNurseryActive(false); setProjectsActive(false); closeReader(); hideFindCard();
    if (SCENES[idx].id !== 'about') geese = [];
    clearTimeout(stageTimer);
    const on = () => { stages[idx].classList.add('on'); markVisited(SCENES[idx].id); setFunActive(SCENES[idx].id === 'fun'); setNurseryActive(SCENES[idx].id === 'seedbed'); setProjectsActive(SCENES[idx].id === 'projects'); };
    instant ? on() : (stageTimer = setTimeout(on, DURATION * 0.55));
  }
  const indexFromHash = () => Math.max(0, SCENES.findIndex(s => '#/' + s.id === location.hash));
  addEventListener('hashchange', () => {
    const next = indexFromHash(), fwd = (next - current + SCENES.length) % SCENES.length;
    if (fwd) travel = fwd <= SCENES.length / 2 ? 1 : -1;
    if (POST_LINK.test(location.hash)) return openPostLink();
    if (location.hash === '#/study') return openStudy();
    closeStudy();
    go(indexFromHash());
  });
  addEventListener('keydown', e => {
    if (readerOpen) { if (e.key === 'Escape') closeReader(); return; }
    if (lightbox.classList.contains('on')) { if (e.key === 'Escape') closeLightbox(); return; }
    if (mapOpen) { if (e.key === 'Escape' || e.key === 'm' || e.key === 'M') closeMap(); return; }
    if (studyOpen) { if (e.key === 'Escape') leaveStudy(); return; }
    if (e.key === 'm' || e.key === 'M') { openMap(); return; }
    if (e.key === 'Escape' && jPanel.classList.contains('on')) { jPanel.classList.remove('on'); jBtn.setAttribute('aria-expanded', 'false'); return; }
    if (e.key === 'Escape') setMeNear(false, true);
    if (e.key === 'ArrowRight') location.hash = '/' + SCENES[(current + 1) % SCENES.length].id;
    if (e.key === 'ArrowLeft') location.hash = '/' + SCENES[(current - 1 + SCENES.length) % SCENES.length].id;
  });
  document.getElementById('langBtn').onclick = () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    try { localStorage.setItem('lang', lang); } catch {}
    applyLang();
  };
  addEventListener('pointermove', e => {
    tx = e.clientX; ty = e.clientY; lastMove = performance.now();
    cvs.style.cursor = funActive && inPond(tx, ty) ? 'pointer' : '';
    if (current === 0 && stages[0].classList.contains('on') && finds.length) senseFinds(tx, ty);
    const overUi = e.target.closest && e.target.closest('.topbar, .sign, .stele, .hang, .bubble, .plant-hit, .reader, .flower-hit, .findcard, .journal, .jpanel, .study, .mapview, .skip');
    if (!lightbox.classList.contains('on') && !overUi) walk(tx, ty, performance.now());
    if (meBox && current === 0 && stages[0].classList.contains('on')) {
      const cx = (meBox.x0 + meBox.x1) / 2, cy = (meBox.y0 + meBox.y1) / 2, reach = Math.max(90, meBox.x1 - meBox.x0);
      setMeNear(bubbleHover || Math.hypot(tx - cx, ty - cy) < reach);
    }
  });
  // Touch and keyboard: tap or focus the figure to toggle the bubble.
  document.getElementById('meRing').onclick = () => setMeNear(!meNear, true);
  const bubbleEl = document.getElementById('meBubble');
  bubbleEl.onmouseenter = () => { bubbleHover = true; };
  bubbleEl.onmouseleave = () => { bubbleHover = false; };
  document.documentElement.addEventListener('pointerleave', () => { tx = ty = -1e4; });
  addEventListener('click', e => {
    if (funActive && e.target === cvs && inPond(e.clientX, e.clientY)) tossPebble(e.clientX, e.clientY);
    if (!jPanel.contains(e.target) && !jBtn.contains(e.target)) { jPanel.classList.remove('on'); jBtn.setAttribute('aria-expanded', 'false'); }
    if (talking && !e.composedPath().includes(meEl)) setMeNear(false, true);
    // Catch the goose and it recites its line.
    for (const g of geese) if (g.pose && !g.pose.done && Math.hypot(e.clientX - g.pose.x, e.clientY - g.pose.y) < 40 * g.S) showPoem();
  });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 200); });

  const lightbox = document.getElementById('lightbox'), lbBox = document.getElementById('lbBox');
  function openLightbox(fill) { lbBox.replaceChildren(); fill(lbBox); lightbox.classList.add('on'); document.getElementById('lbClose').focus(); }
  function closeLightbox() {
    lightbox.classList.remove('on'); lbBox.replaceChildren();
    if (POST_LINK.test(location.hash)) history.replaceState(null, '', studyOpen ? '#/study' : '#/' + SCENES[current].id);
  }
  document.getElementById('lbClose').onclick = closeLightbox;
  lightbox.onclick = e => { if (e.target === lightbox) closeLightbox(); };

  current = indexFromHash();
  if (location.hash === '#/study') openStudy();
  applyLang();
  // Words first: the stage shows straight away and the garden fills in once its image has loaded.
  showStage(current, true);
  build().then(() => { showStage(current, true); requestAnimationFrame(frame); })
    .catch(() => { location.hash = '/study'; })
    // Posts and photos load once the garden is up, so they don't compete with it for bandwidth.
    .finally(() => { loadFun(); loadWriting(); });
  loadArtwork();
})();
</script>
</body>
</html>
