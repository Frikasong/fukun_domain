name: Sync Mock Interviewer

# Keeps fukuny.xyz/mock-interviewer/ on the latest release of
# github.com/Frikasong/mock-interviewer (the release's index.html asset).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download the latest release
        id: fetch
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/index.html https://github.com/Frikasong/mock-interviewer/releases/latest/download/index.html
          # Only accept a real copy of the page.
          grep -q "<title>Mock Interviewer</title>" /tmp/index.html
          mkdir -p mock-interviewer
          cp /tmp/index.html mock-interviewer/index.html

      - name: Commit and push if changed
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mock-interviewer/index.html
          if git diff --cached --quiet; then
            echo "Mock Interviewer is already up to date"
            exit 0
          fi
          git commit -m "Sync Mock Interviewer from its latest release"
          git push

      - name: Report fetch issue and continue
        if: steps.fetch.outcome != 'success'
        run: echo "Could not fetch the latest Mock Interviewer release. Keeping the current copy."
