name: Sync Instagram Photos

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-instagram:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Fetch Instagram photos
        id: fetch
        continue-on-error: true
        env:
          # Optional override; the script falls back to the built-in fukun_vision feed.
          BEHOLD_FEED_URL: ${{ vars.BEHOLD_FEED_URL || secrets.BEHOLD_FEED_URL }}
        run: node scripts/fetch-instagram.mjs

      - name: Print fetched photo count
        if: steps.fetch.outcome == 'success'
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('instagram-posts.json','utf8'));console.log('Fetched photos:',(p.entries||[]).length);"

      - name: Report fetch issue and continue
        if: steps.fetch.outcome != 'success'
        run: echo "Instagram sync failed (check the Behold feed is live). Keeping previous instagram-posts.json and continuing."

      - name: Commit and push if changed
        if: steps.fetch.outcome == 'success'
        run: |
          mkdir -p instagram-images
          git add instagram-posts.json instagram-images
          if git diff --cached --quiet; then
            echo "No Instagram updates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync photos from Instagram"
          git push
