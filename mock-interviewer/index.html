<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Interviewer</title>
<style>
/* Ratio style: white page, ink text, one ultramarine accent, Spectral headings, Inter text.
   No web fonts are loaded: the tool makes no network requests. Spectral and Inter are used
   if installed, with close system fallbacks otherwise. */
:root{
  color-scheme:light dark;
  --bg:light-dark(#ffffff,#0d0e18);
  --ink:light-dark(#14110f,#ecebf3);
  --muted:light-dark(#5d5f6b,#a3a5b6);
  --faint:light-dark(#7c7f8c,#7d8096);
  --line:light-dark(#dfe1e8,#262838);
  --field:light-dark(#9aa0ae,#4a4e66);
  --blue:light-dark(#1d2bd8,#8d96ff);
  --on-blue:light-dark(#ffffff,#0d0e18);
  --soft:light-dark(#eef0ff,#161a3a);
  --panel:light-dark(#f6f7fa,#14162a);
  --ok:var(--blue);
  --amber:light-dark(#b86e00,#e0a54a);
  --alarm:light-dark(#c0362c,#ff7a6b);
  --serif:"Spectral",Georgia,"Iowan Old Style","Songti SC","Noto Serif CJK SC","Noto Serif SC",serif;
  --sans:"Inter",ui-sans-serif,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:var(--blue)}
code{font-family:var(--mono);font-size:.88em;background:var(--soft);padding:1px 5px;border-radius:3px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
textarea,input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--field);border-radius:4px;padding:10px 12px;width:100%;min-height:44px}
textarea{font-family:var(--mono);font-size:14px;line-height:1.55;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--faint)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.lbl{font-size:14px;font-weight:600;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--blue);color:var(--blue);border-radius:4px;padding:0 20px;font-weight:600;background:var(--bg);transition:background .15s,color .15s}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--blue);color:var(--on-blue)}
.btn.primary:hover{filter:brightness(1.1);background:var(--blue)}
.btn.stop{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{border-color:transparent;background:none;color:var(--blue);padding:0 10px}
.btn.ghost:hover{text-decoration:underline;background:none}
.btn[disabled]{opacity:.35;cursor:not-allowed}

/* ---- shell ---- */
.masthead{display:flex;align-items:center;gap:10px 24px;padding:14px max(5vw,16px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.wordmark{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1;margin-right:auto}
.wordmark b{color:var(--blue)}
.priv{font-size:14px;color:var(--muted)}
.lang{display:flex;gap:4px}
.lang button{min-height:36px;padding:0 10px;font-size:15px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.lang button[aria-pressed=true]{color:var(--blue);border-bottom-color:var(--blue)}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(28px,4vw,56px) max(5vw,16px) 80px}

/* ---- setup ---- */
.lede{font-family:var(--serif);font-weight:700;font-size:clamp(32px,4.6vw,52px);line-height:1.05;letter-spacing:-.02em;margin:0 0 14px;max-width:20ch;text-wrap:balance}
.sub{color:var(--muted);max-width:62ch;margin:0 0 clamp(28px,4vw,48px);font-size:17px}
.field{margin-bottom:34px;border-top:3px solid var(--ink);padding-top:12px;max-width:900px}
.field.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(16em,1fr));gap:12px 24px}
.field>.lbl,.field.row .lbl{display:block;margin-bottom:8px}
.hint{font-size:14px;color:var(--muted);margin-top:8px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 200px}
.scripts{display:grid;grid-template-columns:repeat(auto-fill,minmax(14em,1fr));gap:12px 20px;margin:4px 0 12px}
.script{border-top:3px solid var(--line);padding:12px 0 10px;text-align:left;min-height:44px}
.script:hover b{color:var(--blue)}
.script[aria-pressed=true]{border-top-color:var(--blue)}
.script[aria-pressed=true] b{color:var(--blue)}
.script b{display:block;font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.2;margin-bottom:4px}
.script span{font-size:14px;color:var(--muted)}
.toggles{display:flex;gap:10px 28px;flex-wrap:wrap}
.tg{display:flex;gap:10px;align-items:center;font-size:16px;color:var(--ink);min-height:44px}
.tg input{width:20px;height:20px;min-height:0;accent-color:var(--blue);margin:0}
.err{color:var(--alarm);font-size:15px;margin-top:10px;font-weight:600}
.notice{background:var(--soft);border-radius:6px;padding:16px 20px;color:var(--ink);font-size:15px;margin:32px 0;max-width:900px}

/* ---- session ---- */
.stage{display:grid;grid-template-columns:200px minmax(0,1fr) 280px;gap:clamp(20px,3vw,40px);align-items:start}
.rail{border-top:3px solid var(--ink);padding-top:6px}
.qitem{display:flex;gap:12px;padding:10px 0;font-size:15px;color:var(--muted);text-align:left;width:100%;border-bottom:1px solid var(--line);min-height:44px;align-items:baseline}
.qitem b{flex:none;min-width:1.6em;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;color:var(--faint)}
.qitem.done{color:var(--muted)}
.qitem.now{color:var(--ink);font-weight:600}
.qitem.now b{color:var(--blue)}
.qitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cardwrap{position:relative}
.cue{height:24px;font-size:15px;font-weight:600;color:var(--blue);opacity:0;transition:opacity .5s;margin-bottom:8px}
.cue.on{opacity:1}
.card{background:var(--soft);color:var(--ink);border-radius:6px;padding:clamp(24px,3vw,40px) clamp(22px,3vw,40px) clamp(28px,3vw,44px);position:relative;overflow:hidden}
.card .kicker{font-size:14px;font-weight:600;color:var(--blue);margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap}
.card .kicker span+span::before{content:"·";margin-right:10px;color:var(--muted)}
.card .q{font-family:var(--serif);font-weight:700;font-size:clamp(26px,3vw,36px);line-height:1.2;letter-spacing:-.01em;margin:0;text-wrap:balance}
.card .fact{font-family:var(--serif);font-size:18px;line-height:1.6;margin-top:22px;white-space:pre-wrap;border-top:1px solid color-mix(in srgb,var(--blue) 25%,transparent);padding-top:18px}
.bar{position:absolute;left:0;bottom:0;height:6px;width:0%;background:var(--blue);transition:width .12s linear,background .3s}
.bar.warn{background:var(--amber)}
.bar.over{background:var(--alarm)}

.deck{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.clock{font-family:var(--serif);font-weight:700;font-size:clamp(40px,4.4vw,52px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:3.4ch;margin-right:12px}
.clock.warn{color:var(--amber)}
.clock.over{color:var(--alarm)}
.budget{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.deck .spacer{flex:1}

.panel{margin-top:30px;border-top:3px solid var(--ink);padding-top:12px}
.checks{display:flex;gap:4px 24px;flex-wrap:wrap;margin-bottom:16px}
.prepbox{margin-top:30px;border-top:3px solid var(--ink);padding-top:12px;font-size:16px}
.prepbox .lbl{margin-bottom:10px;display:block}
.prepbox p{margin:0 0 8px;max-width:64ch}
.prepbox em{color:var(--blue);font-style:normal;font-weight:600}

.aside{font-size:15px}
.cam{width:100%;aspect-ratio:4/3;background:var(--panel);border:1px solid var(--line);border-radius:6px;object-fit:cover}
video.cam{transform:scaleX(-1)}
.rec{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:600;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--field)}
.dot.live{background:var(--alarm);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}.bar{transition:none}}
.tx{margin-top:22px;border-top:3px solid var(--ink);padding-top:12px}
.tx textarea{min-height:220px}
.interim{color:var(--faint)}

/* ---- debrief ---- */
.tblwrap{overflow-x:auto}
.score{width:100%;border-collapse:collapse;font-size:15px;margin:24px 0}
.score th,.score td{border-bottom:1px solid var(--line);padding:12px 12px 12px 0;text-align:left;vertical-align:top}
.score th{font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid var(--ink)}
.score td.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.score th:nth-child(n+2){text-align:right}
.score .over{color:var(--alarm);font-weight:600}
.dl{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.vid{margin-top:12px;display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted)}

/* ---- interviewer figure ---- */
.ivrow{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.iv{flex:none;width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--soft)}
.iv svg{width:100%;height:100%;display:block}
.iv-bg{fill:var(--soft)}
.iv-coat{fill:light-dark(#1b2470,#2a3590)}
.iv-lapel{fill:light-dark(#141b57,#222c7a)}
.iv-shirt{fill:#fff}
.iv-tie{fill:var(--blue)}
.iv-skin{fill:#e8c3a3}
.iv-skin-shade{fill:#d7aa86}
.iv-hair{fill:#2a2420}
.iv-ink{fill:#1a1614}
.iv-glasses{stroke:#1a1614;stroke-width:2}
.iv-brow{stroke:#2a2420;stroke-width:2.4;stroke-linecap:round}
.iv-nose{stroke:#c08f6c;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.iv-lips{stroke:#8c4b3c;stroke-width:2;stroke-linecap:round}
.iv-open{fill:#8c4b3c;opacity:0}
.iv-head,.iv-eyes,.iv-mouth{transform-box:fill-box;transform-origin:center}
.iv-eyes{animation:blink 5s infinite}
@keyframes blink{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(.1)}}
.iv[data-state=asking] .iv-open{animation:talk .32s infinite alternate}
.iv[data-state=asking] .iv-lips{opacity:0}
@keyframes talk{from{opacity:1;transform:scaleY(.35)}to{opacity:1;transform:scaleY(1)}}
.iv[data-state=listening] .iv-head{animation:nod 3.2s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-3deg) translateY(1px)}}
.iv[data-state=thinking] .iv-eyes{transform:translate(2px,-2px);animation:none}
.iv[data-state=thinking] .iv-brow{transform:translateY(-1.5px)}
.ivtext{display:flex;flex-direction:column;line-height:1.35}
.ivtext b{font-weight:600}
.ivtext span{color:var(--muted);font-size:15px}
.ivtext em{font-style:normal;font-size:13px;color:var(--blue);font-weight:600}
@media (prefers-reduced-motion:reduce){.iv *{animation:none!important}}
/* ---- follow-up and coach ---- */
.fu{margin-top:30px;border-top:3px solid var(--blue);padding-top:12px}
.fu-q{font-family:var(--serif);font-weight:700;font-size:clamp(22px,2.4vw,28px);line-height:1.25;margin:8px 0 0;text-wrap:balance}
.fu-wait{display:flex;gap:6px;margin:14px 0 0}
.fu-wait i{width:9px;height:9px;border-radius:50%;background:var(--blue);animation:pulse 1.2s infinite}
.fu-wait i:nth-child(2){animation-delay:.2s}.fu-wait i:nth-child(3){animation-delay:.4s}
.aibox summary{cursor:pointer;min-height:44px;display:flex;align-items:center;list-style-position:inside}
.aigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(16em,1fr));gap:14px 24px;margin-top:10px}
.aigrid[hidden]{display:none}
.aigrid .wide{grid-column:1/-1}
.aigrid .lbl{display:block;margin-bottom:8px}
.aistat{font-size:15px;margin-left:10px}
.aistat.ok{color:var(--blue);font-weight:600}
.aistat.bad{color:var(--alarm)}
.coach{margin-top:30px;border-top:3px solid var(--ink);padding-top:12px;max-width:900px}
.coachtext{margin-top:10px;font-size:16px}
.coachtext h3{font-family:var(--serif);font-size:22px;margin:22px 0 6px}
.coachtext p,.coachtext li{max-width:70ch}

@media (max-width:980px){
  .stage{grid-template-columns:minmax(0,1fr) 260px}
  .rail{grid-column:1/-1;display:flex;gap:0 20px;overflow-x:auto;border-top:3px solid var(--ink)}
  .qitem{width:auto;flex:none;max-width:15em;border-bottom:0}
}
@media (max-width:700px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .priv{order:3;flex-basis:100%}
  .qitem{max-width:11em}
  .score{font-size:14px}
}
</style>
</head>

  <span class="wordmark">Mock Interviewer<b>.</b></span>
  <span class="priv" id="mh-priv"></span>

    <button id="lang-zh" aria-pressed="false">中文</button>

</header>

/* ======================= question parsing ======================= */
function parseBudget(v){
  if(!v) return null;
  const s=String(v).trim().toLowerCase();
  let m=s.match(/^(\d+(?:\.\d+)?)\s*m/); if(m) return Math.round(parseFloat(m[1])*60);
  m=s.match(/^(\d+)\s*s?$/); if(m) return parseInt(m[1],10);
  return null;
}
const FIELDMAP={type:"type",budget:"budget",reading:"reading",mode:"type","类型":"type","题型":"type","预算":"budget","时间":"budget","时长":"budget","阅读":"reading","阅读时间":"reading",
  "best story":"best","beststory":"best","最优素材":"best","素材":"best",
  backup:"backup","次优":"backup",opener:"opener","开场句":"opener","开头一句":"opener",
  watch:"watch","注意":"watch",framework:"watch","框架":"watch",
  fact:"fact","factpattern":"fact","fact pattern":"fact","题面":"fact",
  key:"key","answer key":"key","answerkey":"key","参考答案":"key",
  source:"source","来源":"source"};
function parseBank(md){
  const out=[]; let cur=null, lastField=null;
  for(const raw of (md||"").split(/\r?\n/)){
    const h=raw.match(/^###\s*(.*?)\s*$/);
    if(h){
      if(cur) out.push(cur);
      cur = h[1] ? {text:h[1],fields:{}} : null;   // an empty "###" is a blank template slot: close, don't collect
      lastField=null; continue;
    }
    if(!cur) continue;
    const f=raw.match(/^\s*[-*]\s*([^:：]{1,24})[:：]\s*(.*)$/);
    if(f){
      const key=FIELDMAP[f[1].trim().toLowerCase()]||null;
      lastField=key;
      if(key) cur.fields[key]=(f[2]||"").trim();
      continue;
    }
    if(lastField && /^\s{2,}\S/.test(raw)){
      cur.fields[lastField]=((cur.fields[lastField]||"")+"\n"+raw.trim()).trim();
    }
  }
  if(cur) out.push(cur);
  return out.map((q,i)=>({
    n:i+1, text:q.text,
    type:q.fields.type||"",
    isCase:/case|fact|笔试|案例/i.test(q.fields.type||"")||!!q.fields.fact,
    budget:parseBudget(q.fields.budget)|| (q.fields.fact?600:120),
    reading:parseBudget(q.fields.reading)||(q.fields.fact?600:0),
    best:q.fields.best||"", backup:q.fields.backup||"",
    opener:q.fields.opener||"", watch:q.fields.watch||"",
    fact:q.fields.fact||"", key:q.fields.key||"", source:q.fields.source||""
  }));
}

/* ========================= media plumbing ========================= */
async function initMedia(){
  if(!S.opts.cam && !S.opts.mic) return;
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({video:S.opts.cam,audio:true});
    S.camReady=true;
  }catch(e){ S.camReady=false; }
}
function startClip(){
  if(!S.stream) return;
  try{
    S.chunks=[];
    S.rec=new MediaRecorder(S.stream);
    S.rec.ondataavailable=e=>{ if(e.data&&e.data.size) S.chunks.push(e.data); };
    S.rec.onstop=()=>{
      if(!S.chunks.length) return;
      const b=new Blob(S.chunks,{type:S.chunks[0].type||"video/webm"});
      S.clips[S.qs[S.i].n]={url:URL.createObjectURL(b),size:b.size};
      render();
    };
    S.rec.start();
  }catch(e){}
}
function stopClip(){ try{ if(S.rec&&S.rec.state!=="inactive") S.rec.stop(); }catch(e){} S.rec=null; }

function startRecog(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||!S.opts.mic) return;
  try{
    const r=new SR();
    r.continuous=true; r.interimResults=true;
    r.lang=/[\u4e00-\u9fa5]/.test(S.qs[S.i].text)?"zh-CN":"en-US";
    r.onresult=e=>{
      let fin="",itr="";
      for(let k=e.resultIndex;k<e.results.length;k++){
        const r0=e.results[k];
        if(r0.isFinal) fin+=r0[0].transcript; else itr+=r0[0].transcript;
      }
      if(fin){ const a=ans(); a.transcript=(a.transcript?a.transcript+" ":"")+fin.trim(); }
      S.interim=itr;
      const ta=$("#tx"); if(ta&&document.activeElement!==ta) ta.value=ans().transcript+(itr?" "+itr:"");
    };
    r.onerror=()=>{};
    r.onend=()=>{ if(S.phase==="answering"){ try{r.start()}catch(e){} } };
    r.start(); S.recog=r;
  }catch(e){}
}
function stopRecog(){ try{ if(S.recog){S.recog.onend=null;S.recog.stop();} }catch(e){} S.recog=null; S.interim=""; }

function speak(text){
  if(!S.opts.speak||!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=/[\u4e00-\u9fa5]/.test(text)?"zh-CN":"en-US";
    u.rate=.98;
    u.onstart=()=>setIv("asking");
    u.onend=()=>setIv(S.phase==="answering"?"listening":S.phase==="marking"?"done":"idle");
    speechSynthesis.speak(u);
  }catch(e){}
}

async function aiChat(messages,maxTokens){
  const base=S.ai.base.trim().replace(/\/+$/,""), model=S.ai.model.trim();
  if(!base||!model) throw new Error(t("errSetup"));
  const headers={"Content-Type":"application/json"};
  if(S.ai.key.trim()) headers.Authorization="Bearer "+S.ai.key.trim();
  if(/anthropic\.com/.test(base)) headers["anthropic-dangerous-direct-browser-access"]="true";
  if(/openrouter\.ai/.test(base)){ headers["X-Title"]="Mock Interviewer"; }
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),60000);
  let r;
  try{
    r=await fetch(base+"/chat/completions",{method:"POST",headers,signal:ctl.signal,
      body:JSON.stringify({model,messages,max_tokens:maxTokens||400,temperature:0.6})});
  }catch(e){
    clearTimeout(timer);
    throw new Error(e.name==="AbortError"? t("errTime") : t("errNet").replace("{b}",base));
  }
  clearTimeout(timer);
  if(!r.ok){
    let detail=String(r.status);
    try{ const j=await r.json(); const m=j.error?.message||j.message||j.error; if(m) detail+=" · "+String(typeof m==="string"?m:JSON.stringify(m)).slice(0,160); }catch(e){}
    throw new Error((r.status===401||r.status===403? t("errAuth") : r.status===404? t("errModel") : t("errHttp")).replace("{s}",detail));
  }
  const j=await r.json();
  const txt=(j.choices?.[0]?.message?.content||"").toString().trim();
  if(!txt) throw new Error(t("errEmpty"));
  return txt;
}

async function askFollowUp(){
  const q=S.qs[S.i], a=ans();
  S.fu={state:"loading"}; setIv("thinking"); render();
  const L=/[一-龥]/.test(q.text);
  const prepared=[q.opener&&`Opener: ${q.opener}`,q.best&&`Best story: ${q.best}`,q.watch&&`Watch: ${q.watch}`].filter(Boolean).join("\n");
  const sys=`You are the interviewer${S.org?` at ${S.org}`:""}${S.role?` for the ${S.role} role`:""}, in a practice interview. After the candidate answers, you ask exactly one follow-up, the one a real panel would ask: what they personally did, a number, who disagreed, what they would do differently, or the point they skipped. Under 35 words. No praise, no feedback, no preamble. Reply with the question only, in ${L?"Chinese":"the language of the question"}.`;
  const user=`Question: ${q.text}\n\nWhat the candidate prepared for it:\n${prepared||"(nothing)"}\n\nMaterial they prepared overall (for context):\n${(S.prep||"(none)").slice(0,4000)}\n\nWhat they said (speech-to-text, may contain errors):\n${a.transcript.trim()||"(no transcript; ask a follow-up a panel would ask on this question anyway)"}`;
  try{
    let txt=await aiChat([{role:"system",content:sys},{role:"user",content:user}],160);
    txt=txt.replace(/^["“'「]+|["”'」]+$/g,"").trim();
    if(S.phase!=="marking"||S.qs[S.i]!==q) return;
    S.fu={state:"ready",text:txt}; S.iv=S.opts.speak?"asking":"done"; render(); speak(txt);
  }catch(e){
    if(S.phase!=="marking"||S.qs[S.i]!==q) return;
    S.fu={state:"error",msg:e.message}; setIv("done"); render();
  }
}
function answerFollowUp(){
  const q=S.qs[S.i], txt=S.fu?.text; if(!txt) return;
  let n=q.n+"a"; while(S.qs.some(x=>x.n===n)) n=n.replace(/([a-z])$/,(c)=>String.fromCharCode(c.charCodeAt(0)+1));
  S.qs.splice(S.i+1,0,{n,text:txt,type:t("fuTag"),isFollow:true,isCase:false,budget:60,reading:0,best:"",backup:"",opener:"",watch:"",fact:"",key:"",source:"AI follow-up"});
  S.fu=null; S.i++; enterQuestion();
}
async function askCoach(){
  S.coach={state:"loading"}; renderDebrief();

  const L=LANG==="zh";
  try{
    const txt=await aiChat([{role:"system",content:`You are an exacting interview coach. Follow the coaching prompt at the top of the record exactly. Reply in ${L?"Chinese":"English"}, in markdown.`},{role:"user",content:md}],2000);
    S.coach={state:"ready",text:txt,by:`${aiName()} · ${S.ai.model}`};
  }catch(e){ S.coach={state:"error",msg:e.message}; }
  if(S.phase==="debrief") renderDebrief();
}
function mdLite(s){
  // Tiny, safe markdown: escape everything, then headings, bold, lists, paragraphs.
  const out=[]; let list=null;
  const inline=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const close=()=>{ if(list){ out.push(`</${list}>`); list=null; } };
  for(const line of String(s).split(/\r?\n/)){
    let m;
    if(!line.trim()){ close(); continue; }
    if((m=line.match(/^#{1,4}\s+(.*)/))){ close(); out.push(`<h3>${inline(m[1])}</h3>`); continue; }
    if((m=line.match(/^\s*[-*•]\s+(.*)/))){ if(list!=="ul"){ close(); out.push("<ul>"); list="ul"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if((m=line.match(/^\s*\d+[.)、]\s*(.*)/))){ if(list!=="ol"){ close(); out.push("<ol>"); list="ol"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    close(); out.push(`<p>${inline(line)}</p>`);
  }
  close(); return out.join("");
}

/* ========================== session flow ========================== */
function ans(){
  const n=S.qs[S.i].n;
  if(!S.answers[n]) S.answers[n]={elapsed:0,transcript:"",c1:false,c2:false,c3:false,note:"",skipped:false};

}
async function start(){
  S.qs=parseBank(S.bankMd);
  if(!S.qs.length){ $("#err").textContent=t("noq"); return; }
  S.i=0; S.answers={}; S.clips={}; S.coach=null; S.fu=null;
  window.scrollTo(0,0);
  await initMedia();
  enterQuestion();
}
function enterQuestion(){
  const q=S.qs[S.i];
  S.elapsed=0; S.cueOn=false; S.fu=null; S.iv=S.opts.speak?"asking":"idle";
  S.phase = q.isCase ? "reading" : "reading";
  render();
  speak(q.text);
  if(!S.opts.speak||!window.speechSynthesis) S.iv="idle";
  if(q.isCase && q.reading) beginTimer(q.reading,true);
}
function beginTimer(){
  clearInterval(S.tick);
  S.t0=Date.now();
  S.tick=setInterval(()=>{
    S.elapsed=(Date.now()-S.t0)/1000;
    if(S.phase==="answering"){
      const on=S.elapsed<15;
      if(on!==S.cueOn){ S.cueOn=on; const c=$(".cue"); if(c) c.classList.toggle("on",on); }
    }
    paintClock();
  },100);
}
function beginAnswer(){
  S.phase="answering"; S.elapsed=0; S.cueOn=true; S.iv="listening";
  try{speechSynthesis.cancel()}catch(e){}
  render(); beginTimer(); startClip(); startRecog();
}
function endAnswer(skipped){
  clearInterval(S.tick); stopClip(); stopRecog();
  try{speechSynthesis.cancel()}catch(e){}
  const a=ans(); a.elapsed=Math.round(S.elapsed); a.skipped=!!skipped;
  S.phase="marking"; S.iv="done"; S.fu=null; render(); save();
  const q=S.qs[S.i];
  if(!skipped && aiReady() && S.ai.followups && !q.isFollow && !q.isCase) askFollowUp();
}
function nextQuestion(){
  if(S.i>=S.qs.length-1){ finish(); return; }
  S.i++; enterQuestion();
}
function finish(){
  clearInterval(S.tick); stopClip(); stopRecog();
  if(S.stream){ S.stream.getTracks().forEach(x=>x.stop()); S.stream=null; }
  S.phase="debrief"; render(); save();
}
function paintClock(){
  const q=S.qs[S.i]; const el=$(".clock"), bar=$(".bar");
  if(!el||!q) return;
  const budget = S.phase==="reading"&&q.isCase ? q.reading : q.budget;
  const left = budget - S.elapsed;
  el.textContent = budget? mmss(Math.ceil(left)) : mmss(Math.floor(S.elapsed));
  const pct = budget? Math.min(100,(S.elapsed/budget)*100) : 0;
  const warn = budget && S.elapsed>budget*.75 && S.elapsed<=budget;
  const over = budget && S.elapsed>budget;
  el.classList.toggle("warn",!!warn); el.classList.toggle("over",!!over);
  if(bar){ bar.style.width=pct+"%"; bar.classList.toggle("warn",!!warn); bar.classList.toggle("over",!!over); }
}

/* =========================== debrief =========================== */
function wc(s){ const z=(s||"").trim(); if(!z) return 0;
  return /[\u4e00-\u9fa5]/.test(z) ? z.replace(/\s/g,"").length : z.split(/\s+/).length; }

function buildMarkdown(){
  const L=LANG==="zh";
  const head=[];
  head.push(`# ${L?"模拟面试复盘":"Mock interview debrief"} — ${S.org||"—"}${S.role?" · "+S.role:""}`);
  head.push(`${L?"日期":"Date"}: ${new Date().toISOString().slice(0,10)}`);
  head.push("");
  head.push(`## ${t("coachTitle")}`);
  head.push("```");
  head.push(L
   ? `你是我的面试教练。下面是一场模拟面试的完整记录：每题的题面、我准备好的素材、我实际说的话、用时对预算、以及我的自评。请逐题给我：
1) 开头 15 秒有没有给结论；
2) STAR 完整度，最常丢的 Result 有没有丢；
3) 用时对预算——超了该砍哪一段，不足该补什么；
4) 我准备的素材和我实际说出口的差在哪（这一条最重要，请具体指出我丢了哪个准备好的点）。
每题给 1-5 分和一句可以直接照念的更好开头。最后列出最该重练的 3 题，以及需要新写或修订的故事卡。不要泛泛鼓励，要具体到可执行。`
   : `You are my interview coach. Below is a full record of one mock interview: each question, the material I had prepared, what I actually said, time against budget, and my own marks. For each question tell me:
1) whether I gave a conclusion in the first 15 seconds;
2) STAR completeness, especially whether the Result went missing;
3) time against budget — what to cut if I ran over, what to add if I ran short;
4) the gap between what I prepared and what I actually said (this one matters most — name the prepared point I dropped).
Score each answer 1-5 and give one better opening line I could say verbatim. Finish with the three questions to re-run first and any story cards to write or revise. Be specific and actionable rather than encouraging.`);
  head.push("```");
  head.push("");

  if(S.prep.trim()){
    head.push(`## ${L?"我准备的材料":"Material I prepared"}`);
    head.push(S.prep.trim());
    head.push("");
  }

  const rows=[];
  let total=0;
  S.qs.forEach(q=>{
    const a=S.answers[q.n]; if(!a) return;
    total+=a.elapsed||0;
    rows.push(`### Q${qid(q.n)} — ${q.text}`);
    rows.push(`- ${L?"类型":"type"}: ${q.type||"—"}${q.isFollow?` (${L?"AI 面试官现场追问":"asked live by the AI interviewer"})`:""}`);
    rows.push(`- ${L?"用时/预算":"time / budget"}: ${mmss(a.elapsed)} / ${mmss(q.budget)}${a.elapsed>q.budget?` (${t("over")} ${mmss(a.elapsed-q.budget)})`:""}`);
    rows.push(`- ${L?"自评":"self-marks"}: ${t("c1")}=${a.c1?"Y":"N"} · ${t("c2")}=${a.c2?"Y":"N"} · ${t("c3")}=${a.c3?"Y":"N"}${a.skipped?" · SKIPPED":""}`);
    if(q.opener||q.best||q.watch){
      rows.push(`- ${L?"我准备的":"what I prepared"}: ${[q.opener&&`${t("pOpener")}: ${q.opener}`,q.best&&`${t("pStory")}: ${q.best}`,q.watch&&`${t("pWatch")}: ${q.watch}`].filter(Boolean).join(" | ")}`);
    } else {
      rows.push(`- ${L?"我准备的":"what I prepared"}: —`);
    }
    if(q.key) rows.push(`- ${L?"参考答案":"answer key"}: ${q.key.replace(/\n/g," ")}`);
    rows.push("");
    rows.push(`**${L?"我实际说的":"What I actually said"}**`);
    rows.push("");
    rows.push(a.transcript.trim()||`_(${L?"无转录":"no transcript"})_`);
    rows.push("");
    if(a.note.trim()){ rows.push(`**${t("note")}**: ${a.note.trim()}`); rows.push(""); }
  });

  const coach = S.coach?.state==="ready"
    ? `\n## ${t("coachHead").replace("{p}",S.coach.by)}\n\n${S.coach.text.trim()}\n` : "";
  return head.join("\n")+`## ${L?"逐题记录":"Question by question"}\n\n`+rows.join("\n")
    +`\n---\n${t("total")}: ${mmss(total)}\n`+coach;
}

    ${aiReady()&&S.ai.coach?`<section class="coach">
      ${!S.coach?`<button class="btn" id="coach-go">${esc(t("coachAsk").replace("{p}",aiName()))}</button>`:""}
      ${S.coach?.state==="loading"?`<p class="hint">${esc(t("coachWait").replace("{p}",aiName()))}</p>`:""}
      ${S.coach?.state==="error"?`<p class="err">${esc(t("coachFail").replace("{e}",S.coach.msg))}</p><button class="btn" id="coach-go">${esc(t("coachAsk").replace("{p}",aiName()))}</button>`:""}
      ${S.coach?.state==="ready"?`<span class="lbl">${esc(t("coachHead").replace("{p}",S.coach.by))}</span><div class="coachtext">${mdLite(S.coach.text)}</div>`:""}
    </section>`:""}
    ${clips?`<div class="field" style="margin-top:26px"><span class="lbl">${esc(t("exportAll"))}</span><div class="dl">${clips}</div></div>`:""}
    <div class="notice">${esc(aiReady()?t("aiSends").replace("{p}",aiName()):t("privacy"))}</div>`;

  $("#dl-md").addEventListener("click",()=>{
    const blob=new Blob([buildMarkdown()],{type:"text/markdown"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`debrief-${(S.org||"session").replace(/[^\w\u4e00-\u9fa5-]+/g,"-").toLowerCase()}-${new Date().toISOString().slice(0,10)}.md`;
    a.click();
  });
  $("#again").addEventListener("click",()=>{ S.phase="setup"; S.answers={}; S.clips={}; S.coach=null; render(); });
  const cg=$("#coach-go"); if(cg) cg.addEventListener("click",askCoach);
}

/* ============================ boot ============================ */
function setLang(l){
  LANG=l; document.documentElement.lang=l==="zh"?"zh":"en";
  $("#lang-en").setAttribute("aria-pressed",String(l==="en"));
  $("#lang-zh").setAttribute("aria-pressed",String(l==="zh"));
  $("#mh-priv").textContent=privLine();
  render();
}
$("#lang-en").addEventListener("click",()=>setLang("en"));
$("#lang-zh").addEventListener("click",()=>setLang("zh"));
window.addEventListener("beforeunload",e=>{ if(S.phase!=="setup"){e.preventDefault();e.returnValue="";} });
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT") return;
  if(e.code==="Space"){ e.preventDefault();
    if(S.phase==="reading") beginAnswer();
    else if(S.phase==="answering") endAnswer(false);
    else if(S.phase==="marking") nextQuestion(); }
});
loadDraft();
aiLoad();
if(!S.bankMd) S.bankMd=SCRIPTS.panel.md.trim();
setLang(LANG);
</script>
</body>
</html>
